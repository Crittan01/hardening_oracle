# roles/hardening/tasks/main.yml
---
- name: Mostrar instancia actual a procesar
  ansible.builtin.debug:
    msg: "Procesando hardening para instancia: {{ hardening_current_instance | upper }} (Usuario: {{ hardening_current_user }})"
  tags: always

# Inicializar variables con valores por defecto vacíos para evitar errores
- name: Inicializar variables de entorno Oracle
  ansible.builtin.set_fact:
    oracle_home_env_result: {}
    oracle_base_env_result: {}
  tags: always

# Mecanismo de respaldo para ORACLE_HOME
- name: Obtener ORACLE_HOME desde entorno si no se pudo obtener de oratab
  ansible.builtin.shell: . ~/.bash_profile && echo $ORACLE_HOME
  become: true
  become_user: "{{ hardening_current_user }}"
  register: oracle_home_env_result
  changed_when: false
  when: hardening_oracle_home is not defined or hardening_oracle_home == ""
  tags: always

# Mecanismo de respaldo para ORACLE_BASE
- name: Obtener ORACLE_BASE desde entorno si no se pudo obtener de oratab
  ansible.builtin.shell: . ~/.bash_profile && echo $ORACLE_BASE
  become: true
  become_user: "{{ hardening_current_user }}"
  register: oracle_base_env_result
  changed_when: false
  when: hardening_oracle_base is not defined or hardening_oracle_base == ""
  tags: always

# Debug para entender mejor los valores actuales
- name: DEBUG - Verificar valores de variables Oracle
  ansible.builtin.debug:
    msg:
      - "hardening_oracle_home definida: {{ hardening_oracle_home is defined }}"
      - "hardening_oracle_base definida: {{ hardening_oracle_base is defined }}"
      - "oracle_home_env_result.stdout definida: {{ oracle_home_env_result.stdout is defined }}"
      - "oracle_base_env_result.stdout definida: {{ oracle_base_env_result.stdout is defined }}"
  tags: always

# Establecer valores finales con verificación segura
- name: Configurar variables Oracle finales
  ansible.builtin.set_fact:
    hardening_oracle_home: >-
      {{ hardening_oracle_home | default(
         oracle_home_env_result.stdout | default('') | trim if oracle_home_env_result.stdout is defined
         else '/u01/app/oracle/product/19.0.0/dbhome_1'
      ) }}
    hardening_oracle_base: >-
      {{ hardening_oracle_base | default(
         oracle_base_env_result.stdout | default('') | trim if oracle_base_env_result.stdout is defined
         else '/u01/app/oracle'
      ) }}
    hardening_oracle_sid: "{{ hardening_current_instance }}"
  tags: always

# Verificar configuración final
- name: Verificar variables Oracle finales
  ansible.builtin.debug:
    msg:
      - "ORACLE_HOME final: {{ hardening_oracle_home }}"
      - "ORACLE_BASE final: {{ hardening_oracle_base }}"
      - "ORACLE_SID final: {{ hardening_oracle_sid }}"
  tags: always

- name: Extraer versiones
  ansible.builtin.set_fact:
    oracle_version_full: "{{ oracle_version_result.stdout_lines[0] | default('Oracle Database') }}"
  tags: always
