# roles/hardening/tasks/autenticacion/cis_41.yml
---
- name: CIS 41 - Verificación de Tiempo de rehúso de contraseñas
  block:
    # Paso 1: Ejecutar la consulta proporcionada en el instructivo (corrigiendo el espacio en el nombre)
    - name: (Check - CIS 41) - Verificar configuración de PASSWORD_REUSE_TIME
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT profile || ',' || resource_name || ',' || limit
        FROM dba_profiles
        WHERE resource_name='PASSWORD_REUSE_TIME';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_41_check_result
      changed_when: false

    # Paso 2: Procesar los resultados de la consulta para todos los perfiles
    - name: (Check - CIS 41) - Procesar resultados de todos los perfiles
      ansible.builtin.set_fact:
        cis_41_all_profiles_raw: "{{ cis_41_check_result.stdout_lines | select('match', '.+,.+,.+') | list }}"
        cis_41_expected_value: "365"

    # Paso 3: Estructurar datos de todos los perfiles
    - name: (Check - CIS 41) - Estructurar datos de todos los perfiles
      ansible.builtin.set_fact:
        cis_41_all_profiles: "{{ cis_41_all_profiles | default([]) +
          [{'profile': profile_item.split(',')[0] | trim,
          'resource': profile_item.split(',')[1] | trim,
          'limit': profile_item.split(',')[2] | trim}] }}"
      loop: "{{ cis_41_all_profiles_raw }}"
      loop_control:
        loop_var: profile_item
      when: cis_41_all_profiles_raw | length > 0

    # Paso 4: Identificar perfiles no conformes (valor < 365 o UNLIMITED)
    - name: (Check - CIS 41) - Identificar perfiles no conformes
      ansible.builtin.set_fact:
        cis_41_noncompliant_profiles: "{{ cis_41_all_profiles | default([]) |
          selectattr('limit', 'ne', '365') |
          rejectattr('limit', 'search', 'DEFAULT') |
          list }}"
      when: cis_41_all_profiles is defined and cis_41_all_profiles | length > 0

    # Paso 5: Verificar el perfil DEFAULT específicamente
    - name: (Check - CIS 41) - Verificar perfil DEFAULT
      ansible.builtin.set_fact:
        cis_41_default_profile: "{{ cis_41_all_profiles | default([]) | selectattr('profile', 'equalto', 'DEFAULT') | first | default({}) }}"
        cis_41_default_in_results: "{{ cis_41_all_profiles | default([]) | selectattr('profile', 'equalto', 'DEFAULT') | list | length > 0 }}"
      when: cis_41_all_profiles is defined and cis_41_all_profiles | length > 0

    # Paso 6: Determinar si el perfil DEFAULT es conforme
    - name: (Check - CIS 41) - Determinar si DEFAULT es conforme
      ansible.builtin.set_fact:
        cis_41_default_compliant: "{{ cis_41_default_profile.limit == '365' if cis_41_default_in_results else false }}"
      when: cis_41_default_in_results is defined

    # Paso 7: Determinar estado general de conformidad
    - name: (Check - CIS 41) - Determinar estado general de conformidad
      ansible.builtin.set_fact:
        cis_41_compliant_initial: "{{ cis_41_default_compliant | default(false) }}"

    # Paso 8: Mostrar resultados para depuración
    - name: (Check - CIS 41) - Mostrar resultado de verificación
      ansible.builtin.debug:
        msg:
          - "Perfiles analizados: {{ cis_41_all_profiles | default([]) | length }}"
          - "¿Perfil DEFAULT encontrado?: {{ cis_41_default_in_results | default(false) }}"
          - "Valor actual en DEFAULT: {{ cis_41_default_profile.limit | default('No encontrado') }}"
          - "¿DEFAULT conforme?: {{ cis_41_default_compliant | default(false) }}"
          - "Estado general de conformidad: {{ cis_41_compliant_initial }}"
        verbosity: 0

    # Paso 9: Determinar si se requiere remediación
    - name: (Check - CIS 41) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_41_needs_remediation: "{{ not cis_41_compliant_initial }}"

    # Paso 10: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 41) - Configurar tiempo de rehúso de contraseñas
      when: cis_41_needs_remediation
      block:
        # Paso 10.1: Remediar perfil DEFAULT
        - name: (Remediation - CIS 41) - Configurar PASSWORD_REUSE_TIME en perfil DEFAULT
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER PROFILE DEFAULT LIMIT PASSWORD_REUSE_TIME 365;
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_41_default_remediation
          changed_when: "'Profile altered' in cis_41_default_remediation.stdout"

        # Paso 10.2: Establecer estado después de la remediación
        - name: (Remediation - CIS 41) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_41_compliant_final: true
            cis_41_was_remediated: true
            cis_41_requires_restart: false

    # Paso 11: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 41) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_41_compliant_final: "{{ cis_41_compliant_initial }}"
        cis_41_was_remediated: false
        cis_41_requires_restart: false
      when: not cis_41_needs_remediation | bool

    # Paso 12: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 41 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_41] }}"
      vars:
        instance_result_cis_41:
          instance_name: "{{ hardening_current_instance }}"
          cis_41:
            parametro: "Tiempo de rehúso de contraseñas"
            description: "Número de días antes de poder rehusar una contraseña."
            implementacion: |
              Para configurar en el profile Default, ejecute la siguiente sentencia:
              Alter profile DEFAULT limit PASSWORD_REUSE_TIME 365;
            verificacion: >-
              Para verificar el estado del parámetro PASSWORD_REUSE_TIME, ejecute la siguiente sentencia:
              select profile, resource_name, limit from dba_profiles where resource_name='PASSWORD_REUSE_TIME';
            remediacion: |
              ALTER PROFILE DEFAULT LIMIT PASSWORD_REUSE_TIME 365;
            nota: >-
              Este límite especifica que una contraseña no se puede reutilizar hasta después de 365 días,
              lo que refuerza la seguridad al evitar la reutilización frecuente de contraseñas.
            type: "security"
            expected_value: "{{ cis_41_expected_value }}"
            all_profiles: "{{ cis_41_all_profiles | default([]) }}"
            noncompliant_profiles: "{{ cis_41_noncompliant_profiles | default([]) }}"
            default_in_results: "{{ cis_41_default_in_results | default(false) }}"
            default_profile: "{{ cis_41_default_profile | default({}) }}"
            default_compliant: "{{ cis_41_default_compliant | default(false) }}"
            requires_restart: "{{ cis_41_requires_restart | default(false) }}"
            compliant_initial: "{{ cis_41_compliant_initial }}"
            compliant_final: "{{ cis_41_compliant_final }}"
            was_remediated: "{{ cis_41_was_remediated }}"
