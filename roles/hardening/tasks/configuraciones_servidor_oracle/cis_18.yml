# roles/hardening/tasks/configuraciones_servidor_oracle/cis_18.yml
---
- name: CIS 18 - Verificación de SQLNET.ALLOWED_LOGON_VERSION
  block:
    # Paso 1: Verificar la existencia del archivo sqlnet.ora
    - name: (Check - CIS 18) - Comprobar si existe el archivo sqlnet.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
      register: cis_18_sqlnet_file
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 2: Verificar el valor actual de SQLNET.ALLOWED_LOGON_VERSION
    - name: (Check - CIS 18) - Leer el valor actual de SQLNET.ALLOWED_LOGON_VERSION
      ansible.builtin.shell: |
        set -o pipefail
        grep -i "SQLNET.ALLOWED_LOGON_VERSION" {{ hardening_oracle_home }}/network/admin/sqlnet.ora | grep -v "^#" | awk -F= '{print $2}' | tr -d ' '
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_18_timeout_result
      changed_when: false
      failed_when: false
      when: cis_18_sqlnet_file.stat.exists

    # Paso 3: Procesar el resultado y establecer banderas si el archivo existe
    - name: (Check - CIS 18) - Procesar resultado
      ansible.builtin.set_fact:
        cis_18_file_exists: "{{ cis_18_sqlnet_file.stat.exists }}"
        cis_18_param_exists: "{{ cis_18_timeout_result.stdout | default('') | trim != '' }}"
        cis_18_param_value: "{{ cis_18_timeout_result.stdout | default('') | trim }}"
      when: cis_18_sqlnet_file.stat.exists

    # Paso 4: Establecer valores por defecto si el archivo no existe
    - name: (Check - CIS 18) - Establecer valores por defecto si el archivo no existe
      ansible.builtin.set_fact:
        cis_18_file_exists: false
        cis_18_param_exists: false
        cis_18_param_value: ""
      when: not cis_18_sqlnet_file.stat.exists | default(false)

    # Paso 5: Establecer el valor esperado y determinar cumplimiento
    - name: (Check - CIS 18) - Establecer valor esperado y determinar cumplimiento
      ansible.builtin.set_fact:
        cis_18_expected_value: "11"
        cis_18_compliant_initial: "{{ cis_18_file_exists and cis_18_param_exists and cis_18_param_value == '3' }}"

    # Paso 6: Debug para mostrar la información detectada
    - name: (Check - CIS 18) - Mostrar información detectada
      ansible.builtin.debug:
        msg:
          - "Archivo sqlnet.ora existe: {{ cis_18_file_exists }}"
          - "Parámetro SQLNET.ALLOWED_LOGON_VERSION existe: {{ cis_18_param_exists }}"
          - "Valor actual: {{ cis_18_param_value }}"
          - "Valor esperado: {{ cis_18_expected_value }}"
          - "Estado de cumplimiento: {{ cis_18_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 18) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_18_needs_remediation: "{{ not cis_18_compliant_initial }}"

    # Paso 8: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 18) - Configurar SQLNET.ALLOWED_LOGON_VERSION
      when: cis_18_needs_remediation
      block:
        # Paso 8.1: Crear una copia de seguridad del archivo sqlnet.ora si existe
        - name: (Remediation - CIS 18) - Crear copia de seguridad de sqlnet.ora
          ansible.builtin.copy:
            src: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            dest: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora.{{ ansible_date_time.date }}"
            remote_src: true
            mode: "{{ cis_18_sqlnet_file.stat.mode }}"
            owner: "{{ cis_18_sqlnet_file.stat.pw_name }}"
            group: "{{ cis_18_sqlnet_file.stat.gr_name }}"
          become: true
          become_user: root
          when: cis_18_file_exists

        # Paso 8.2: Crear el archivo sqlnet.ora si no existe
        - name: (Remediation - CIS 18) - Crear el archivo sqlnet.ora si no existe
          ansible.builtin.file:
            path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            state: touch
            owner: "{{ hardening_current_user }}"
            group: "{{ hardening_oracle_grp }}"
            mode: "0644"
          become: true
          become_user: root
          when: not cis_18_file_exists

        # Paso 8.3: Agregar o actualizar el parámetro en el archivo
        - name: (Remediation - CIS 18) - Configurar parámetro SQLNET.ALLOWED_LOGON_VERSION
          ansible.builtin.lineinfile:
            path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            regexp: "^\\s*SQLNET.ALLOWED_LOGON_VERSION\\s*="
            line: "SQLNET.ALLOWED_LOGON_VERSION={{ cis_18_expected_value }}"
            state: present
            backup: false
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_18_remediation_result

        # Paso 8.4: Mostrar mensaje informativo sobre reinicio pendiente
        - name: (Remediation - CIS 18) - Informar sobre reinicio pendiente
          ansible.builtin.debug:
            msg: "NOTA: Se ha modificado el parámetro SQLNET.ALLOWED_LOGON_VERSION={{ cis_18_expected_value }}"

        # Paso 8.5: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 18) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_18_was_remediated: true
            cis_18_compliant_final: true
            cis_18_remediated_value: "{{ cis_18_expected_value }}"

    # Paso 9: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 18) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_18_was_remediated: false
        cis_18_compliant_final: "{{ cis_18_compliant_initial }}"
        cis_18_remediated_value: "{{ cis_18_param_value }}"
      when: not cis_18_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 18 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_18] }}"
      vars:
        instance_result_cis_18:
          instance_name: "{{ hardening_current_instance }}"
          cis_18:
            parametro: "SQLNET.ALLOWED_LOGON_VERSION"
            description: >-
              Configurar la versión de login {{ cis_18_expected_value }}, lo cual previene que antiguos que no autenticación fuerte conecten.
            implementacion: |
              En el archivo sqlnet.ora, configurar el siguiente parámetro:
              SQLNET.ALLOWED_LOGON_VERSION={{ cis_18_expected_value }}
            verificacion: >-
              Verificar la configuración establecida con el comando:
              grep -i ALLOWED_LOGON_VERSION sqlnet.ora
            commando: |
              cd $ORACLE_HOME/network/admin
              grep -i ALLOWED_LOGON_VERSION sqlnet.ora
            nota: >-
              Configurar la versión de login {{ cis_18_expected_value }}, lo cual previene que antiguos que no autenticación fuerte conecten.
            type: "network"
            file_exists: "{{ cis_18_file_exists }}"
            param_exists: "{{ cis_18_param_exists }}"
            param_value: "{{ cis_18_param_value }}"
            expected_value: "{{ cis_18_expected_value }}"
            remediated_value: "{{ cis_18_remediated_value | default(cis_18_param_value) }}"
            compliant_initial: "{{ cis_18_compliant_initial }}"
            compliant_final: "{{ cis_18_compliant_final }}"
            was_remediated: "{{ cis_18_was_remediated }}"
