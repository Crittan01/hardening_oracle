---
- name: CIS 68 - Verificación del parámetro control_files y sus permisos
  block:
    # Definiciones básicas
    - name: (Check - CIS 68) - Definiciones y variables
      ansible.builtin.set_fact:
        cis_68_valid_pattern: "^ora[a-zA-Z0-9]{3,4}$"
        cis_68_invalid_users: ["oracle"]
        cis_68_explict_valid_users: ["grid"]
        cis_68_valid_groups: ["dba", "oinstall", "asmdba"]
        cis_68_instance_user_valid: "{{
          hardening_current_user is match('^ora[a-zA-Z0-9]{3,4}$') and
          hardening_current_user != 'oracle' or
          hardening_current_user in ['grid'] }}"
        cis_68_file_details: []
        cis_68_compliant_files: []
        cis_68_non_compliant_files: []

    # Obtener valor del parámetro control_files
    - name: (Check - CIS 68) - Obtener valor del parámetro control_files
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT value FROM v\$parameter WHERE name='control_files';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_68_param_result
      changed_when: false

    # Procesar valor del parámetro
    - name: (Check - CIS 68) - Procesar valor del parámetro
      ansible.builtin.set_fact:
        cis_68_param_value: "{{ cis_68_param_result.stdout | trim }}"
        cis_68_param_configured: "{{ cis_68_param_result.stdout | trim | length > 0 }}"
        cis_68_paths: "{{ cis_68_param_result.stdout | trim | split(',') | map('trim') | list if cis_68_param_result.stdout | trim | length > 0 else [] }}"

    # Verificar permisos de cada archivo control
    - name: (Check - CIS 68) - Verificar permisos de archivos control
      ansible.builtin.stat:
        path: "{{ path_item }}"
        get_attributes: true
      register: cis_68_stat_results
      loop: "{{ cis_68_paths }}"
      loop_control:
        loop_var: path_item
      become: true
      when: cis_68_param_configured and cis_68_paths | length > 0

    # Procesar resultados
    - name: (Check - CIS 68) - Procesar resultados
      ansible.builtin.set_fact:
        cis_68_file_details: "{{ cis_68_file_details + [file_detail] }}"
        cis_68_compliant_files: "{{ cis_68_compliant_files + [file_item.stat.path] if file_compliant else cis_68_compliant_files }}"
        cis_68_non_compliant_files: "{{ cis_68_non_compliant_files + [file_detail] if not file_compliant else cis_68_non_compliant_files }}"
      vars:
        # Definir criterios de validación
        valid_owner: "{{ file_item.stat.exists and file_item.stat.pw_name == hardening_current_user }}"
        valid_naming: "{{
          file_item.stat.exists and
          (file_item.stat.pw_name is match(cis_68_valid_pattern) and file_item.stat.pw_name not in cis_68_invalid_users) or
          file_item.stat.pw_name in cis_68_explict_valid_users }}"
        valid_group: "{{ file_item.stat.exists and file_item.stat.gr_name in cis_68_valid_groups }}"
        valid_permission: "{{
          file_item.stat.exists and
          (file_item.stat.mode | regex_replace('^0', '') | int(base=8) <= 0o750) }}"
        # Determinar cumplimiento general
        file_compliant: "{{ file_item.stat.exists and valid_owner and valid_naming and valid_group and valid_permission }}"
        # Crear objeto con detalles
        file_detail:
          {
            "path": "{{ file_item.stat.path }}",
            "exists": "{{ file_item.stat.exists }}",
            "owner": "{{ file_item.stat.pw_name if file_item.stat.exists else 'N/A' }}",
            "group": "{{ file_item.stat.gr_name if file_item.stat.exists else 'N/A' }}",
            "mode": "{{ file_item.stat.mode if file_item.stat.exists else 'N/A' }}",
            "owner_valid": "{{ valid_owner }}",
            "naming_valid": "{{ valid_naming }}",
            "group_valid": "{{ valid_group }}",
            "permission_valid": "{{ valid_permission }}",
            "compliant": "{{ file_compliant }}",
          }
      loop: "{{ cis_68_stat_results.results | default([]) }}"
      loop_control:
        loop_var: file_item
      when: cis_68_stat_results is defined

    # Determinar estado general
    - name: (Check - CIS 68) - Establecer estado general
      ansible.builtin.set_fact:
        cis_68_total_files: "{{ cis_68_file_details | length }}"
        cis_68_valid_count: "{{ cis_68_compliant_files | length }}"
        cis_68_invalid_count: "{{ cis_68_non_compliant_files | length }}"
        cis_68_compliant_initial: "{{
          cis_68_param_configured and
          cis_68_non_compliant_files | length == 0 and
          cis_68_file_details | length > 0 }}"
        cis_68_compliant_final: "{{
          cis_68_param_configured and
          cis_68_non_compliant_files | length == 0 and
          cis_68_file_details | length > 0 }}"
        cis_68_was_remediated: false

    # Mostrar resultados para depuración
    - name: (Check - CIS 68) - Mostrar resultados
      ansible.builtin.debug:
        msg:
          - "Instancia: {{ hardening_current_instance }}"
          - "Parámetro configurado: {{ cis_68_param_configured }}"
          - "Archivos válidos: {{ cis_68_valid_count }}"
          - "Archivos no válidos: {{ cis_68_invalid_count }}"
          - "Estado de cumplimiento: {{ cis_68_compliant_initial }}"
        verbosity: 1

    # Agregar resultados a la lista global
    - name: Agregar resultados a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_68] }}"
      vars:
        instance_result_cis_68:
          instance_name: "{{ hardening_current_instance }}"
          cis_68:
            parametro: "init.ora control_files"
            description: "Configuración del parámetro control_files para asegurar el acceso a los archivos de control"
            implementacion: |
              Los archivos de control deben ser de propiedad del usuario que ejecuta la instancia
              (debe seguir el patrón 'ora' + 3-4 caracteres o ser 'grid') y deben pertenecer a un grupo
              válido (dba, oinstall, asmdba). Los permisos deben ser 0750 o más restrictivos.
            verificacion: >-
              Verificar que el parámetro control_files esté configurado correctamente y que
              los archivos de control cumplan con los requisitos de permisos y propiedad.
            objetivo: >-
              Asegurar que los archivos de control críticos estén protegidos con acceso
              restringido solo al propietario y grupo correspondiente.
            commando: |
              SQL> show parameter control_files;
              ls -la <ruta_control_files>
            nota: "Los permisos 0750 significan rwxr-x--- (propietario: rwx, grupo: r-x, otros: ---)"
            type: "filesystem"
            param_configured: "{{ cis_68_param_configured }}"
            param_value: "{{ cis_68_param_value }}"
            file_details: "{{ cis_68_file_details }}"
            instance_user: "{{ hardening_current_user }}"
            instance_user_valid: "{{ cis_68_instance_user_valid }}"
            valid_pattern: "{{ cis_68_valid_pattern }}"
            valid_groups: "{{ cis_68_valid_groups }}"
            total_files: "{{ cis_68_total_files }}"
            valid_count: "{{ cis_68_valid_count }}"
            invalid_count: "{{ cis_68_invalid_count }}"
            compliant_initial: "{{ cis_68_compliant_initial }}"
            compliant_final: "{{ cis_68_compliant_final }}"
            was_remediated: false
