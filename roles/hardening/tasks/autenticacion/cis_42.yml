# roles/hardening/tasks/autenticacion/cis_42.yml
---
- name: CIS 42 - Verificación de Tiempo de bloqueo de cuentas
  block:
    # Paso 1: Ejecutar únicamente la consulta proporcionada en el instructivo
    - name: (Check - CIS 42) - Verificar configuración de PASSWORD_LOCK_TIME
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT P.PROFILE || ',' || P.RESOURCE_NAME || ',' || P.LIMIT FROM DBA_PROFILES P
        WHERE TO_NUMBER(DECODE(P.LIMIT, 'DEFAULT',(SELECT DISTINCT DECODE(LIMIT,'UNLIMITED',9999,LIMIT)
        FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME='PASSWORD_LOCK_TIME'),
        'UNLIMITED','9999', P.LIMIT)) < 1
        AND P.RESOURCE_NAME = 'PASSWORD_LOCK_TIME'
        AND EXISTS ( SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE );
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_42_check_result
      changed_when: false

    # Paso 2: Procesar los resultados de la consulta
    - name: (Check - CIS 42) - Procesar resultados
      ansible.builtin.set_fact:
        cis_42_noncompliant_profiles_raw: "{{ cis_42_check_result.stdout_lines | select('match', '.+,.+,.+') | list }}"
        cis_42_expected_value: "UNLIMITED"

    # Paso 3: Inicializar variables para evitar errores
    - name: (Check - CIS 42) - Inicializar variables
      ansible.builtin.set_fact:
        cis_42_noncompliant_profiles: []
        cis_42_default_in_results: false
        cis_42_default_profile: {}

    # Paso 4: Estructurar datos de perfiles no conformes si existen
    - name: (Check - CIS 42) - Estructurar datos de perfiles no conformes
      ansible.builtin.set_fact:
        cis_42_noncompliant_profiles:
          "{{ cis_42_noncompliant_profiles | default([]) +
          [{'profile': profile_item.split(',')[0] | trim,
          'resource': profile_item.split(',')[1] | trim,
          'limit': profile_item.split(',')[2] | trim}] }}"
      loop: "{{ cis_42_noncompliant_profiles_raw }}"
      loop_control:
        loop_var: profile_item
      when: cis_42_noncompliant_profiles_raw | length > 0

    # Paso 5: Verificar si el perfil DEFAULT está entre los no conformes (siempre se ejecuta)
    - name: (Check - CIS 42) - Verificar si DEFAULT está entre los perfiles no conformes
      ansible.builtin.set_fact:
        cis_42_default_in_results: "{{ (cis_42_noncompliant_profiles | selectattr('profile', 'equalto', 'DEFAULT') | list | length) > 0 }}"
        cis_42_default_profile: "{{ cis_42_noncompliant_profiles | selectattr('profile', 'equalto', 'DEFAULT') | first | default({}) }}"
      when: cis_42_noncompliant_profiles | length > 0

    # Paso 6: Determinar estado de conformidad (DEFAULT es conforme si no está en la lista de no conformes)
    - name: (Check - CIS 42) - Determinar estado de conformidad
      ansible.builtin.set_fact:
        cis_42_compliant_initial: "{{ not cis_42_default_in_results }}"

    # Paso 7: Mostrar resultados para depuración
    - name: (Check - CIS 42) - Mostrar resultado de verificación
      ansible.builtin.debug:
        msg:
          - "¿Perfil DEFAULT no conforme?: {{ cis_42_default_in_results }}"
          - "Estado general de conformidad: {{ cis_42_compliant_initial }}"
        verbosity: 0

    # Paso 8: Determinar si se requiere remediación
    - name: (Check - CIS 42) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_42_needs_remediation: "{{ not cis_42_compliant_initial }}"

    # Paso 9: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 42) - Configurar tiempo de bloqueo de cuentas
      when: cis_42_needs_remediation
      block:
        # Paso 9.1: Remediar perfil DEFAULT
        - name: (Remediation - CIS 42) - Configurar PASSWORD_LOCK_TIME en perfil DEFAULT
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER PROFILE DEFAULT LIMIT PASSWORD_LOCK_TIME UNLIMITED;
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_42_default_remediation
          changed_when: "'Profile altered' in cis_42_default_remediation.stdout"

        # Paso 9.2: Establecer estado después de la remediación
        - name: (Remediation - CIS 42) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_42_compliant_final: true
            cis_42_was_remediated: true
            cis_42_requires_restart: false

    # Paso 10: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 42) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_42_compliant_final: "{{ cis_42_compliant_initial }}"
        cis_42_was_remediated: false
        cis_42_requires_restart: false
      when: not cis_42_needs_remediation | bool

    # Paso 11: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 42 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_42] }}"
      vars:
        instance_result_cis_42:
          instance_name: "{{ hardening_current_instance }}"
          cis_42:
            parametro: "Tiempo de bloqueo de cuentas"
            description: "Tiempo que permanece bloqueada una cuenta, después de agotar los intentos de conexión fallida."
            implementacion: |
              Para configurar en el profile Default, ejecute la siguiente sentencia:
              Alter profile DEFAULT limit password_lock_time Unlimited;
            verificacion: >-
              Para verificar el estado del parámetro PASSWORD_LOCK_TIME, ejecute la siguiente sentencia:
              SELECT P.PROFILE, P.RESOURCE_NAME, P.LIMIT FROM DBA_PROFILES P WHERE TO_NUMBER(DECODE(P.LIMIT, 'DEFAULT',(SELECT DISTINCT DECODE
              (LIMIT,'UNLIMITED',9999,LIMIT) FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME='PASSWORD_LOCK_TIME'), 'UNLIMITED','9999', P.LIMIT))
              < 1 AND P.RESOURCE_NAME = 'PASSWORD_LOCK_TIME' AND EXISTS ( SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE );
            remediacion: |
              ALTER PROFILE DEFAULT LIMIT PASSWORD_LOCK_TIME UNLIMITED;
            nota: >-
              Configurar PASSWORD_LOCK_TIME como UNLIMITED mantiene bloqueadas las cuentas después de exceder intentos
              fallidos de inicio de sesión hasta que el administrador las desbloquee explícitamente,
              proporcionando un nivel de seguridad adicional.
            type: "security"
            expected_value: "{{ cis_42_expected_value }}"
            default_in_results: "{{ cis_42_default_in_results }}"
            default_profile: "{{ cis_42_default_profile }}"
            requires_restart: "{{ cis_42_requires_restart | default(false) }}"
            compliant_initial: "{{ cis_42_compliant_initial }}"
            compliant_final: "{{ cis_42_compliant_final }}"
            was_remediated: "{{ cis_42_was_remediated }}"
