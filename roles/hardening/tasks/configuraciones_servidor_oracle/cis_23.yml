# roles/hardening/tasks/configuraciones_servidor_oracle/cis_23.yml
---
- name: CIS 23 - Verificación de sec_max_failed_login_attempts
  block:
    # Paso 1: Verificar el valor actual del parámetro
    - name: (Check - CIS 23) - Verificar valor actual de sec_max_failed_login_attempts
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select value from v\$parameter where name='sec_max_failed_login_attempts';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_23_param_result
      changed_when: false

    # Paso 2: Procesar el valor obtenido
    - name: (Check - CIS 23) - Procesar valor del parámetro
      ansible.builtin.set_fact:
        cis_23_param_value: "{{ cis_23_param_result.stdout | trim }}"

    # Paso 3: Establecer el valor esperado
    - name: (Check - CIS 23) - Establecer valor esperado
      ansible.builtin.set_fact:
        cis_23_expected_value: "3"

    # Paso 4: Determinar el estado de cumplimiento inicial
    - name: (Check - CIS 23) - Determinar estado de cumplimiento
      ansible.builtin.set_fact:
        cis_23_compliant_initial: "{{ cis_23_param_value == cis_23_expected_value }}"

    # Paso 5: Mostrar resultados para depuración
    - name: (Check - CIS 23) - Mostrar resultados iniciales
      ansible.builtin.debug:
        msg:
          - "Valor actual de sec_max_failed_login_attempts: {{ cis_23_param_value }}"
          - "Valor esperado: {{ cis_23_expected_value }}"
          - "Estado de cumplimiento: {{ cis_23_compliant_initial }}"
        verbosity: 0

    # Paso 6: Determinar si se requiere remediación
    - name: (Check - CIS 23) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_23_needs_remediation: "{{ not cis_23_compliant_initial }}"

    # Paso 7: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 23) - Configurar sec_max_failed_login_attempts
      when: cis_23_needs_remediation
      block:
        # Paso 7.1: Aplicar la remediación
        - name: (Remediation - CIS 23) - Configurar sec_max_failed_login_attempts con el valor correcto
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER SYSTEM SET sec_max_failed_login_attempts=3 SCOPE=SPFILE SID='*';
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_23_remediation_result
          changed_when: "'System altered' in cis_23_remediation_result.stdout"

        # Paso 7.2: Verificar si se requiere reinicio
        - name: (Remediation - CIS 23) - Indicar que se requiere reiniciar la instancia
          ansible.builtin.debug:
            msg: "Se ha modificado el parámetro sec_max_failed_login_attempts. Para la instancia {{ hardening_current_instance }}."

        # Paso 7.3: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 23) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_23_was_remediated: true
            cis_23_compliant_final: true
            cis_23_remediated_value: "{{ cis_23_expected_value }} (pendiente reinicio)"

    # Paso 8: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 23) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_23_was_remediated: false
        cis_23_compliant_final: "{{ cis_23_compliant_initial }}"
        cis_23_remediated_value: "{{ cis_23_param_value }}"
      when: not cis_23_needs_remediation | bool

    # Paso 9: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 23 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_23] }}"
      vars:
        instance_result_cis_23:
          instance_name: "{{ hardening_current_instance }}"
          cis_23:
            parametro: "sec_max_failed_login_attempts"
            description: "Configura el máximo número de intentos de conexión fallidos en 3."
            implementacion: |
              Configurar el siguiente parámetro:
              SEC_MAX_FAILED_LOGIN_ATTEMPTS=3
            verificacion: >-
              Verificar la configuración establecida abriendo el archivo init.ora y
              verifique el parámetro indicado en la implementación.
            commando: |
              SELECT name, value, DECODE(Value,'3','Cumple','Revisar') ESTADO
              FROM v$parameter WHERE name='sec_max_failed_login_attempts';
            remediacion: |
              ALTER SYSTEM SET sec_max_failed_login_attempts=3 SCOPE=SPFILE SID='*';
            nota: >-
              Si fue remediado, <strong>se requiere reiniciar</strong> la instancia para que los cambios surtan efecto,
              ya que se ha configurado con SCOPE=SPFILE.
            type: "parameter"
            param_value: "{{ cis_23_param_value }}"
            expected_value: "{{ cis_23_expected_value }}"
            remediated_value: "{{ cis_23_remediated_value }}"
            compliant_initial: "{{ cis_23_compliant_initial }}"
            compliant_final: "{{ cis_23_compliant_final }}"
            was_remediated: "{{ cis_23_was_remediated }}"
