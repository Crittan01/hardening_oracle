# roles/hardening/tasks/configuraciones_servidor_oracle/cis_13.yml
---
- name: CIS 13 - Verificación de dispatchers
  block:
    # Paso 1: Verificar el valor actual de dispatchers
    - name: (Check - CIS 13) - Verificar valor actual de dispatchers
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select value from v\$parameter where name='dispatchers';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_13_dispatchers_result
      changed_when: false

    # Paso 2: Procesar el valor obtenido
    - name: (Check - CIS 13) - Procesar valor de dispatchers
      ansible.builtin.set_fact:
        cis_13_dispatchers_value: "{{ cis_13_dispatchers_result.stdout | trim }}"
        cis_13_dispatchers_has_xdb: "{{ cis_13_dispatchers_result.stdout | trim | upper is search('XDB') }}"

    # Paso 3: Establecer el valor esperado (sin XDB)
    - name: (Check - CIS 13) - Establecer valor esperado
      ansible.builtin.set_fact:
        cis_13_compliant_initial: "{{ not cis_13_dispatchers_has_xdb }}"

    # Paso 4: Debug avanzado para ayudar a diagnosticar problemas
    - name: (Check - CIS 13) - Debug de valores para comparación
      ansible.builtin.debug:
        msg:
          - "Valor dispatchers actual: '{{ cis_13_dispatchers_value }}'"
          - "¿Contiene XDB?: {{ cis_13_dispatchers_has_xdb }}"
          - "Estado de cumplimiento: {{ cis_13_compliant_initial }}"
        verbosity: 0

    # Paso 5: Mostrar resultados para depuración
    - name: (Check - CIS 13) - Mostrar resultados iniciales
      ansible.builtin.debug:
        msg:
          - "Valor actual de dispatchers: {{ cis_13_dispatchers_value }}"
          - "Estado de cumplimiento: {{ cis_13_compliant_initial }}"
        verbosity: 0

    # Paso 6: Determinar si se requiere remediación
    - name: (Check - CIS 13) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_13_needs_remediation: "{{ not cis_13_compliant_initial }}"

    # Paso 7: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 13) - Configurar dispatchers
      when: cis_13_needs_remediation
      block:
        # Paso 7.1: Si el resultado está vacío o es inválido, usar cadena vacía
        - name: (Remediation - CIS 13) - Verificar si el nuevo valor es válido
          ansible.builtin.set_fact:
            cis_13_final_value: "{{ '' | string }}"

        # Paso 7.2: Aplicar la remediación
        - name: (Remediation - CIS 13) - Configurar dispatchers sin XDB
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER SYSTEM SET dispatchers='{{ cis_13_final_value }}' SCOPE=SPFILE SID='*';
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_13_remediation_result
          changed_when: "'System altered' in cis_13_remediation_result.stdout"

        # Paso 7.3: Verificar si se requiere reinicio
        - name: (Remediation - CIS 13) - Indicar que se requiere reiniciar la instancia
          ansible.builtin.debug:
            msg: "Se ha modificado el parámetro dispatchers. Para la instancia {{ hardening_current_instance }}."

        # Paso 7.4: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 13) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_13_was_remediated: true
            cis_13_compliant_final: true
            cis_13_remediated_value: "{{ cis_13_final_value }} ''"

    # Paso 8: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 13) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_13_was_remediated: false
        cis_13_compliant_final: "{{ cis_13_compliant_initial }}"
        cis_13_remediated_value: "{{ cis_13_dispatchers_value }}"
      when: not cis_13_needs_remediation | bool

    # Paso 9: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 13 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_13] }}"
      vars:
        instance_result_cis_13:
          instance_name: "{{ hardening_current_instance }}"
          cis_13:
            parametro: "dispatchers"
            description: "Deshabilitar a nivel de motor de base de datos los puertos DB XML (FTP y HTTP / WebDAV)"
            implementacion: |
              La forma más fácil de deshabilitar los puertos DB XML (FTP y HTTP / WebDAV) es remover la siguiente línea del archivo init.ora:
              dispatchers= (PROTOCOL= TCP)(SERVICE= <oracle_sid>XDB)
            verificacion: >-
              Verificar la configuración establecida con el comando:
              grep -i XDB spfile<sid>.ora
            commando: |
              select name, value from v$parameter where name='dispatchers';
              select name, value, DECODE (Value,'(PROTOCOL=TCP) (SERVICE=IDMXDB)','Cumple','Revisar') ESTADO from v$parameter where name='dispatchers';
            nota: Si fue remediado, <strong>se requiere reiniciar</strong> la instancia para que los cambios surtan efecto.
            type: "security"
            dispatchers_value: "{{ cis_13_dispatchers_value }}"
            expected_value: "{{ cis_13_final_value }}"
            has_xdb: "{{ cis_13_dispatchers_has_xdb }}"
            compliant_initial: "{{ cis_13_compliant_initial }}"
            compliant_final: "{{ cis_13_compliant_final }}"
            was_remediated: "{{ cis_13_was_remediated }}"
            remediated_value: "{{ cis_13_remediated_value | default(cis_13_dispatchers_value) }}"
