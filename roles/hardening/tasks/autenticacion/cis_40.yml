# roles/hardening/tasks/autenticacion/cis_40.yml
---
- name: CIS 40 - Verificación de Rehúso de contraseñas
  block:
    # Paso 1: Ejecutar la consulta proporcionada en el instructivo (corrigiendo el espacio en el nombre del parámetro)
    - name: (Check - CIS 40) - Verificar configuración de PASSWORD_REUSE_MAX
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT P.PROFILE || ',' || P.RESOURCE_NAME || ',' || P.LIMIT FROM DBA_PROFILES P
        WHERE TO_NUMBER(DECODE(P.LIMIT, 'DEFAULT',(SELECT DISTINCT DECODE(LIMIT,'UNLIMITED',9999,LIMIT)
        FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME='PASSWORD_REUSE_MAX'),
        'UNLIMITED','9999',P.LIMIT)) < 4
        AND P.RESOURCE_NAME = 'PASSWORD_REUSE_MAX'
        AND EXISTS ( SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE );
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_40_check_result
      changed_when: false

    # Paso 2: Procesar los resultados de la consulta
    - name: (Check - CIS 40) - Procesar resultados
      ansible.builtin.set_fact:
        cis_40_noncompliant_profiles_raw: "{{ cis_40_check_result.stdout_lines | select('match', '.+,.+,.+') | list }}"
        cis_40_expected_value: "4"

    # Paso 3: Estructurar datos de perfiles no conformes
    - name: (Check - CIS 40) - Estructurar datos de perfiles no conformes
      ansible.builtin.set_fact:
        cis_40_noncompliant_profiles:
          "{{ cis_40_noncompliant_profiles | default([]) +
          [{'profile': profile_item.split(',')[0] | trim,
          'resource': profile_item.split(',')[1] | trim,
          'limit': profile_item.split(',')[2] | trim}] }}"
      loop: "{{ cis_40_noncompliant_profiles_raw }}"
      loop_control:
        loop_var: profile_item
      when: cis_40_noncompliant_profiles_raw | length > 0

    # Paso 4: Verificar si el perfil DEFAULT está entre los no conformes
    - name: (Check - CIS 40) - Verificar si DEFAULT está entre los perfiles no conformes
      ansible.builtin.set_fact:
        cis_40_default_in_results: "{{ cis_40_noncompliant_profiles | default([]) | selectattr('profile', 'equalto', 'DEFAULT') | list | length > 0 }}"
        cis_40_default_profile: "{{ cis_40_noncompliant_profiles | default([]) | selectattr('profile', 'equalto', 'DEFAULT') | first | default({}) }}"
      when: cis_40_noncompliant_profiles is defined and cis_40_noncompliant_profiles | length > 0

    # Paso 5: Determinar estado de conformidad
    - name: (Check - CIS 40) - Determinar estado de conformidad
      ansible.builtin.set_fact:
        cis_40_compliant_initial: "{{ (cis_40_noncompliant_profiles_raw | default([])) | length == 0 }}"

    # Paso 6: Mostrar resultados para depuración
    - name: (Check - CIS 40) - Mostrar resultado de verificación
      ansible.builtin.debug:
        msg:
          - "Número de perfiles no conformes: {{ cis_40_noncompliant_profiles | default([]) | length }}"
          - "¿Perfil DEFAULT no conforme?: {{ cis_40_default_in_results | default(false) }}"
          - "Estado general de conformidad: {{ cis_40_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 40) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_40_needs_remediation: "{{ not cis_40_compliant_initial }}"

    # Paso 8: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 40) - Configurar rehúso de contraseñas
      when: cis_40_needs_remediation
      block:
        # Paso 8.1: Remediar perfil DEFAULT primero (siempre, según instructivo)
        - name: (Remediation - CIS 40) - Configurar PASSWORD_REUSE_MAX en perfil DEFAULT
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER PROFILE DEFAULT LIMIT PASSWORD_REUSE_MAX 4;
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_40_default_remediation
          changed_when: "'Profile altered' in cis_40_default_remediation.stdout"

        # Paso 8.2: Establecer estado después de la remediación
        - name: (Remediation - CIS 40) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_40_compliant_final: true
            cis_40_was_remediated: true
            cis_40_requires_restart: false

    # Paso 9: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 40) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_40_compliant_final: "{{ cis_40_compliant_initial }}"
        cis_40_was_remediated: false
        cis_40_requires_restart: false
      when: not cis_40_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 40 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_40] }}"
      vars:
        instance_result_cis_40:
          instance_name: "{{ hardening_current_instance }}"
          cis_40:
            parametro: "Rehúso de contraseñas"
            description: "Número de contraseñas recordadas antes de ser rehusadas."
            implementacion: |
              Para configurar en el profile Default, ejecute la siguiente sentencia:
              Alter profile DEFAULT LIMIT PASSWORD_REUSE_MAX 4;
            verificacion: >-
              Para verificar el estado del parámetro PASSWORD_REUSE_MAX, ejecute la siguiente sentencia:
              SELECT P.PROFILE, P.RESOURCE_NAME, P.LIMIT FROM DBA_PROFILES P WHERE TO_NUMBER(DECODE(P.LIMIT, 'DEFAULT',(SELECT DISTINCT DECODE
              (LIMIT,'UNLIMITED',9999,LIMIT) FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME='PASSWORD_REUSE_MAX'), 'UNLIMITED','9999',P.LIMIT))
              < 4 AND P.RESOURCE_NAME = 'PASSWORD_REUSE_MAX' AND EXISTS ( SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE );
            remediacion: |
              ALTER PROFILE DEFAULT LIMIT PASSWORD_REUSE_MAX 4;
            nota: >-
              Este límite hace que Oracle recuerde las últimas 4 contraseñas usadas, impidiendo que los usuarios
              reutilicen contraseñas recientes.
            type: "security"
            expected_value: "{{ cis_40_expected_value }}"
            noncompliant_profiles: "{{ cis_40_noncompliant_profiles | default([]) }}"
            default_in_results: "{{ cis_40_default_in_results | default(false) }}"
            default_profile_data: "{{ cis_40_default_profile | default({}) }}"
            requires_restart: "{{ cis_40_requires_restart | default(false) }}"
            compliant_initial: "{{ cis_40_compliant_initial }}"
            compliant_final: "{{ cis_40_compliant_final }}"
            was_remediated: "{{ cis_40_was_remediated }}"
