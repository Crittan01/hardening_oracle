# roles/hardening/tasks/autorizacion/cis_53.yml
---
- name: CIS 53 - Verificación de permisos para comandos DDL, DML, CREATE
  block:
    # Paso 1: Ejecutar la consulta detallada proporcionada en el instructivo
    - name: (Check - CIS 53) - Verificar asignación de privilegios sensibles
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select grantee || ',' || privilege || ',' || admin_option || ',' || common || ',' || inherited from dba_sys_privs where privilege in
        ('CREATE LIBRARY','ALTER SYSTEM', 'CREATE PROCEDURE','BECOME USER', 'SELECT ANY TABLE') and grantee in (select username from dba_users where
        username not in ('SYS' ,'SYSTEM' ,'SYSBACKUP' ,'SYSDG' ,'AUDSYS','SYSKM','SYSRAC' ,'OUTLN','GSMADMIN_INTERNAL' ,'GSMUSER' ,'GSMROOTUSER' ,'DIP',
        'XSNULL' ,'REMOTE_SCHEDULER_AGENT' ,'DBSFWUSER','ORACLE_OCM'  ,'SYS','$UMF' ,'DBSNMP' ,'APPQOSSYS' ,'GSMCATUSER' ,'GGSYS' ,'XDB' ,'ANONYMOUS','WMSYS' ,
        'OJVMSYS' ,'CTXSYS' ,'ORDSYS' ,'SI_INFORMTN_SCHEMA' ,'MDSYS','ORDPLUGINS' ,'ORDDATA' ,'OLAPSYS' ,'MDDATA','DVSYS' ,'DVF'));
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_53_detail_result
      changed_when: false
      failed_when: false

    # Paso 2: Ejecutar la consulta de conteo proporcionada en el instructivo
    - name: (Check - CIS 53) - Contar privilegios sensibles asignados
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select count(*) from (select * from dba_sys_privs where privilege in ('CREATE LIBRARY','ALTER SYSTEM', 'CREATE PROCEDURE','BECOME USER',
        'SELECT ANY TABLE') and grantee in (select username from dba_users where username not in ('SYS' ,'SYSTEM' ,'SYSBACKUP' ,'SYSDG' ,'AUDSYS',
        'SYSKM','SYSRAC' ,'OUTLN','GSMADMIN_INTERNAL' ,'GSMUSER' ,'GSMROOTUSER' ,'DIP','XSNULL' ,'REMOTE_SCHEDULER_AGENT' ,'DBSFWUSER','ORACLE_OCM',
        'SYS','$UMF' ,'DBSNMP' ,'APPQOSSYS' ,'GSMCATUSER' ,'GGSYS' ,'XDB' ,'ANONYMOUS','WMSYS' ,'OJVMSYS' ,'CTXSYS' ,'ORDSYS' ,'SI_INFORMTN_SCHEMA' ,
        'MDSYS','ORDPLUGINS' ,'ORDDATA' ,'OLAPSYS' ,'MDDATA','DVSYS' ,'DVF')));
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_53_count_result
      changed_when: false
      failed_when: false

    # Paso 3: Procesar los resultados
    - name: (Check - CIS 53) - Procesar resultados
      ansible.builtin.set_fact:
        cis_53_count: "{{ cis_53_count_result.stdout | trim | int }}"
        cis_53_detail_raw: "{{ cis_53_detail_result.stdout_lines | select('match', '.+,.+,.+,.+,.+') | list }}"
        cis_53_expected_count: 0

    # Paso 4: Estructurar datos de privilegios encontrados
    - name: (Check - CIS 53) - Inicializar variables
      ansible.builtin.set_fact:
        cis_53_sensitive_privileges: []

    # Paso 5: Estructurar datos de privilegios encontrados si existen
    - name: (Check - CIS 53) - Estructurar datos de privilegios encontrados
      ansible.builtin.set_fact:
        cis_53_sensitive_privileges:
          "{{ cis_53_sensitive_privileges | default([]) +
          [{'grantee': priv_item.split(',')[0] | trim,
          'privilege': priv_item.split(',')[1] | trim,
          'admin_option': priv_item.split(',')[2] | trim,
          'common': priv_item.split(',')[3] | trim,
          'inherited': priv_item.split(',')[4] | trim}] }}"
      loop: "{{ cis_53_detail_raw }}"
      loop_control:
        loop_var: priv_item
      when: cis_53_detail_raw | length > 0

    # Paso 6: Determinar estado de conformidad
    - name: (Check - CIS 53) - Determinar estado de conformidad
      ansible.builtin.set_fact:
        cis_53_compliant_initial: "{{ cis_53_count | int == 0 }}"

    # Paso 7: Mostrar resultados para depuración
    - name: (Check - CIS 53) - Mostrar resultado de verificación
      ansible.builtin.debug:
        msg:
          - "Número de privilegios sensibles asignados: {{ cis_53_count }}"
          - "Privilegios encontrados: {{ cis_53_sensitive_privileges | length }}"
          - "Estado de conformidad: {{ cis_53_compliant_initial }}"
        verbosity: 0

    # Paso 8: No hay remediación automática para este control, solo indicar si se requiere
    - name: (Check - CIS 53) - Determinar si se requiere remediación manual
      ansible.builtin.set_fact:
        cis_53_needs_remediation: "{{ not cis_53_compliant_initial }}"
        cis_53_compliant_final: "{{ cis_53_compliant_initial }}" # Sin remediación automática, el estado final = inicial
        cis_53_was_remediated: false

    # Paso 9: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 53 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_53] }}"
      vars:
        instance_result_cis_53:
          instance_name: "{{ hardening_current_instance }}"
          cis_53:
            parametro: "Restringir permisos para comandos DDL, DML, CREATE"
            description: "Restringir el uso de privilegios CREATE, CREATE LIBRARY, ALTER, SYSTEM, CREATE PROCEDURE, BECOME USER, SELECT ANY TABLE."
            implementacion: |
              Revisar los roles y usuarios que tengan asignados los privilegios de creación de objetos, y retirarlos si no son requeridos.
            verificacion: >-
              Verificar la asignación de privilegios de cuentas y roles de usuario son asignadas a los usuarios: DBA, SYS y SYSTEM.
              select * from dba_sys_privs where privilege in ('CREATE LIBRARY','ALTER SYSTEM', 'CREATE PROCEDURE','BECOME USER', 'SELECT ANY TABLE')
              and grantee in (select username from dba_users where username not in ('SYS','SYSTEM','OUTLN',' DBSNMP','CTXSYS','MDSYS','LBACSYS',
              'GSMADMIN_INTERNAL', 'SYSBACKUP','SYSRAC','XDB','DVF','DBSNMP','SYSDG','WMSYS'));
            remediacion: |
              Revocar los privilegios de comandos DDL, DML, CREATE a los usuarios no autorizados.
              Ejemplo: REVOKE [privilege] FROM [grantee];
            nota: >-
              Este control requiere remediación manual.
            type: "security"
            expected_count: "{{ cis_53_expected_count }}"
            actual_count: "{{ cis_53_count }}"
            sensitive_privileges: "{{ cis_53_sensitive_privileges }}"
            compliant_initial: "{{ cis_53_compliant_initial }}"
            compliant_final: "{{ cis_53_compliant_final }}"
            needs_remediation: "{{ cis_53_needs_remediation }}"
            was_remediated: "{{ cis_53_was_remediated }}"
