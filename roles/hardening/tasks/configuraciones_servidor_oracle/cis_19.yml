# roles/hardening/tasks/configuraciones_servidor_oracle/cis_19.yml
---
- name: CIS 19 - Verificación de procedimientos externos (Permisos en $ORACLE_HOME/lib)
  block:
    # Paso 1: Verificar los permisos actuales de $ORACLE_HOME/lib
    - name: (Check - CIS 19) - Verificar permisos actuales de $ORACLE_HOME/lib
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/lib"
      register: cis_19_lib_stat
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 2: Verificar si el directorio existe
    - name: (Check - CIS 19) - Determinar si el directorio lib existe
      ansible.builtin.set_fact:
        cis_19_lib_exists: "{{ cis_19_lib_stat.stat.exists | default(false) }}"
      when: cis_19_lib_stat.stat is defined

    # Paso 3: Si el directorio no existe, establecer las variables por defecto
    - name: (Check - CIS 19) - Establecer variables por defecto si no existe
      ansible.builtin.set_fact:
        cis_19_lib_exists: false
        cis_19_lib_mode: "N/A"
        cis_19_lib_owner: "N/A"
        cis_19_lib_group: "N/A"
        cis_19_compliant_initial: false
      when: not cis_19_lib_exists | default(false)

    # Paso 4: Si el directorio existe, obtener sus permisos y propietario
    - name: (Check - CIS 19) - Obtener permisos y propietario si existe
      ansible.builtin.set_fact:
        cis_19_lib_mode: "{{ cis_19_lib_stat.stat.mode }}"
        cis_19_lib_owner: "{{ cis_19_lib_stat.stat.pw_name }}"
        cis_19_lib_group: "{{ cis_19_lib_stat.stat.gr_name }}"
        cis_19_lib_perms_octal: "{{ cis_19_lib_stat.stat.mode[-3:] }}"
      when: cis_19_lib_exists | default(false)

    # Paso 5: Verificar si los permisos son conformes (750 o más restrictivos)
    - name: (Check - CIS 19) - Determinar cumplimiento inicial
      ansible.builtin.set_fact:
        # Permisos 750 o más restrictivos (menor que 750 numéricamente)
        cis_19_compliant_initial: "{{ cis_19_lib_perms_octal | default('777') <= '750' }}"
      when: cis_19_lib_exists | default(false)

    # Paso 6: Mostrar información para depuración
    - name: (Check - CIS 19) - Mostrar información detectada
      ansible.builtin.debug:
        msg:
          - "Directorio $ORACLE_HOME/lib existe: {{ cis_19_lib_exists }}"
          - "Permisos actuales: {{ cis_19_lib_mode | default('N/A') }}"
          - "Permisos en octal: {{ cis_19_lib_perms_octal | default('N/A') }}"
          - "Propietario: {{ cis_19_lib_owner | default('N/A') }}"
          - "Grupo: {{ cis_19_lib_group | default('N/A') }}"
          - "Estado de cumplimiento: {{ cis_19_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 19) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_19_needs_remediation: "{{ cis_19_lib_exists | default(false) and not cis_19_compliant_initial }}"

    # Paso 8: Bloque de remediación - Aplicar permisos 750 si se requiere
    - name: (Remediation - CIS 19) - Aplicar permisos correctos a $ORACLE_HOME/lib
      when: cis_19_needs_remediation | bool
      block:
        # Paso 8.1: Cambiar permisos de la carpeta
        - name: (Remediation - CIS 19) - Cambiar permisos a 750 para $ORACLE_HOME/lib
          ansible.builtin.file:
            path: "{{ hardening_oracle_home }}/lib"
            mode: "0750"
            state: directory
            recurse: true
          become: true
          become_user: root
          register: cis_19_remediation_result

        # Paso 8.2: Verificar permisos después de la remediación
        - name: (Remediation - CIS 19) - Verificar permisos después de remediación
          ansible.builtin.stat:
            path: "{{ hardening_oracle_home }}/lib"
          register: cis_19_lib_stat_after
          become: true
          become_user: "{{ hardening_current_user }}"

        # Paso 8.3: Establecer variables de resultado final
        - name: (Remediation - CIS 19) - Establecer variables de resultado final
          ansible.builtin.set_fact:
            cis_19_lib_mode_after: "{{ cis_19_lib_stat_after.stat.mode }}"
            cis_19_lib_perms_octal_after: "{{ cis_19_lib_stat_after.stat.mode[-3:] }}"
            cis_19_compliant_final: "{{ cis_19_lib_stat_after.stat.mode[-3:] <= '750' }}"
            cis_19_was_remediated: true

    # Paso 9: Establecer variables finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 19) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_19_lib_mode_after: "{{ cis_19_lib_mode | default('N/A') }}"
        cis_19_lib_perms_octal_after: "{{ cis_19_lib_perms_octal | default('N/A') }}"
        cis_19_compliant_final: "{{ cis_19_compliant_initial }}"
        cis_19_was_remediated: false
      when: not cis_19_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 19 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_19] }}"
      vars:
        instance_result_cis_19:
          instance_name: "{{ hardening_current_instance }}"
          cis_19:
            parametro: "listener.ora, tnsnames.ora - procedimientos externos"
            description: >-
              Remover las entradas para los procedimientos externos de los archivos listener.ora y tnsnames.ora.
              Los procedimientos externos pueden llamar librerías compartidas en el sistema, que se encuentren
              en la ruta $ORACLE_HOME/lib o $ORACLE_HOME/bin
            implementacion: >-
              Remover las librerías externas compartidas de $ORACLE_HOME/lib o establecer permisos restrictivos.
            verificacion: >-
              Verificar la configuración establecida mediante la inspección de permisos.
            commando: |
              ls -l $ORACLE_HOME/lib
            remediacion: |
              chmod -R 750 $ORACLE_HOME/lib
            nota: >-
              Verificar la configuración establecida: Remediacion por s.o chmod -R 750 $ORACLE_HOME/lib.
            type: "filesystem"
            lib_exists: "{{ cis_19_lib_exists }}"
            lib_mode_before: "{{ cis_19_lib_mode | default('N/A') }}"
            lib_mode_after: "{{ cis_19_lib_mode_after | default('N/A') }}"
            lib_perms_octal_before: "{{ cis_19_lib_perms_octal | default('N/A') }}"
            lib_perms_octal_after: "{{ cis_19_lib_perms_octal_after | default('N/A') }}"
            lib_owner: "{{ cis_19_lib_owner | default('N/A') }}"
            lib_group: "{{ cis_19_lib_group | default('N/A') }}"
            compliant_initial: "{{ cis_19_compliant_initial }}"
            compliant_final: "{{ cis_19_compliant_final }}"
            was_remediated: "{{ cis_19_was_remediated }}"
