# roles/hardening/tasks/autorizacion/cis_49.yml
---
- name: CIS 49 - Verificación de uso de ALL PRIVILEGES
  block:
    # Paso 1: Ejecutar la consulta detallada proporcionada en el instructivo
    - name: (Check - CIS 49) - Verificar asignación de ALL PRIVILEGES
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select * from dba_sys_privs where privilege ='GRANT ALL PRIVILEGES' ;
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_49_detail_result
      changed_when: false
      failed_when: false

    # Paso 2: Ejecutar la consulta de conteo proporcionada en el instructivo
    - name: (Check - CIS 49) - Contar asignaciones de ALL PRIVILEGES
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select count(*) from (select * from dba_sys_privs where privilege ='GRANT ALL PRIVILEGES' );
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_49_count_result
      changed_when: false
      failed_when: false

    # Paso 3: Procesar los resultados
    - name: (Check - CIS 49) - Procesar resultados
      ansible.builtin.set_fact:
        cis_49_count: "{{ cis_49_count_result.stdout | trim | int }}"
        cis_49_detail_raw: "{{ cis_49_detail_result.stdout_lines | default([]) }}"
        cis_49_expected_count: 0

    # Paso 4: Determinar estado de conformidad
    - name: (Check - CIS 49) - Determinar estado de conformidad
      ansible.builtin.set_fact:
        cis_49_compliant_initial: "{{ cis_49_count | int == 0 }}"

    # Paso 5: Mostrar resultados para depuración
    - name: (Check - CIS 49) - Mostrar resultado de verificación
      ansible.builtin.debug:
        msg:
          - "Número de usuarios con GRANT ALL PRIVILEGES: {{ cis_49_count }}"
          - "Estado de conformidad: {{ cis_49_compliant_initial }}"
        verbosity: 0

    # Paso 6: No hay remediación automática para este control, solo indicar si se requiere
    - name: (Check - CIS 49) - Determinar si se requiere remediación manual
      ansible.builtin.set_fact:
        cis_49_needs_remediation: "{{ not cis_49_compliant_initial }}"
        cis_49_compliant_final: "{{ cis_49_compliant_initial }}" # Sin remediación automática, el estado final = inicial
        cis_49_was_remediated: false

    # Paso 7: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 49 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_49] }}"
      vars:
        instance_result_cis_49:
          instance_name: "{{ hardening_current_instance }}"
          cis_49:
            parametro: "ALL PRIVILEGES"
            description: "Restringir uso de ALL PRIVILEGES."
            implementacion: |
              No se debe usar la opción GRANT ALL PRIVILEGES.
            verificacion: >-
              Verificar la asignación de privilegios de cuentas y roles de usuario son asignadas a los usuarios: DBA, SYS y SYSTEM.
              select * from dba_sys_privs where privilege ='GRANT ALL PRIVILEGES' ;
            remediacion: |
              Revocar el privilegio GRANT ALL PRIVILEGES a usuarios no autorizados y otorgar privilegios específicos en su lugar.
            nota: >-
              Este control requiere remediación manual. Se debe evitar otorgar ALL PRIVILEGES
            type: "security"
            expected_count: "{{ cis_49_expected_count }}"
            actual_count: "{{ cis_49_count }}"
            detail_raw: "{{ cis_49_detail_raw }}"
            compliant_initial: "{{ cis_49_compliant_initial }}"
            compliant_final: "{{ cis_49_compliant_final }}"
            needs_remediation: "{{ cis_49_needs_remediation }}"
            was_remediated: "{{ cis_49_was_remediated }}"
