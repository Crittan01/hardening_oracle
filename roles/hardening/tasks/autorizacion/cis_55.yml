# roles/hardening/tasks/autorizacion/cis_53.yml
---
- name: Verificacion permisos PUBLIC
  block:
    # Paso 1: Ejecutar la consulta detallada acorde al instructivo
    - name: (Check - CIS 55) - Verificar permisos PUBLIC
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select GRANTEE || ',' || PRIVILEGE || ',' || type from dba_tab_privs where grantee='PUBLIC' and table_name in ('DBMS_LDAP','UTL_INADDR','UTL_TCP',
        'UTL_MAIL','UTL_SMTP','UTL_DBWS','UTL_ORAMTS','UTL_HTTP','HTTPURITYPE');
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_55_detail_result
      changed_when: false
      failed_when: false

    # Paso 2: Ejecutar la consulta de conteo proporcionada en el instructivo
    - name: (Check - CIS 55) - Conteo permisos PUBLIC
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select count(*) valor from (select GRANTEE || ',' || PRIVILEGE || ',' || type from dba_tab_privs where grantee='PUBLIC' and table_name in ('DBMS_LDAP',
        'UTL_INADDR','UTL_TCP','UTL_MAIL','UTL_SMTP','UTL_DBWS','UTL_ORAMTS','UTL_HTTP','HTTPURITYPE'));
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_55_count_result
      changed_when: false
      failed_when: false

    # Paso 3: Procesar resultados
    - name: (Check - CIS 55) - Procesar resultados
      ansible.builtin.set_fact:
        cis_55_count: "{{ cis_55_count_result.stdout | trim | int }}"
        cis_55_detail_raw: "{{ cis_55_detail_result.stdout_lines | select('match', '.+,.+,.+') | list }}"
        cis_55_expected_count: 0

    # Paso 4: Estructurar datos de privilegios encontrados
    - name: (Check - CIS 55) - Inicializar variables
      ansible.builtin.set_fact:
        cis_55_sensitive_privileges: []

    # Paso 5: Estructurar datos de privilegios encontrados si existen
    - name: (Check - CIS 55) - Estructurar datos en lista de dicts
      ansible.builtin.set_fact:
        cis_55_sensitive_privileges:
          "{{ cis_55_sensitive_privileges | default([]) +
          [{'grantee': priv_item.split(',')[0] | trim,
          'granted_role': priv_item.split(',')[1] | trim,
          'type': priv_item.split(',')[2] | trim}] }}"
      loop: "{{ cis_55_detail_raw }}"
      loop_control:
        loop_var: priv_item
      when: cis_55_detail_raw | length > 0

    # Paso 6: Determinar estado de conformidad
    - name: (Check - CIS 55) - Determinar estado de conformidad
      ansible.builtin.set_fact:
        cis_55_compliant_initial: "{{ cis_55_count | int == 0 }}"

    # Paso 7: Mostrar resultados para depuración
    - name: (Check - CIS 55) - Mostrar resultados de Verificacion
      ansible.builtin.debug:
        msg:
          - "Numero de privilegios PUBLIC: {{ cis_55_count }}"
          - "Privilegios encontrados: {{ cis_55_sensitive_privileges | length }}"
          - "Estado de conformidad: {{ cis_55_compliant_initial }}"
        verbosity: 0

    # Paso 8: No hay remediación automática para este control, solo indicar si se requiere
    - name: (Check - CIS 55) - Determinar si se requiere remediación manual
      ansible.builtin.set_fact:
        cis_55_needs_remediation: "{{ not cis_55_compliant_initial }}"
        cis_55_compliant_final: "{{ cis_55_compliant_initial }}" # Sin remediación automática, el estado final = inicial
        cis_55_was_remediated: false

    # Paso 9: Agregar resultados a lista global
    - name: Agregar resultados de CIS 55 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_55] }}"
      vars:
        instance_result_cis_55:
          instance_name: "{{ hardening_current_instance }}"
          cis_55:
            parametro: "PUBLIC"
            description: Restringir la asignación de PUBLIC
            implementacion: |
              Revisar los usuarios con privilegios "PUBLIC" y restringirlos tanto como sea posible
            verificacion: >-
              Verificar la asignación de privilegios de cuentas y roles de usuario son asignadas a los usuarios: DBA, SYS y SYSTEM.
              <br> select * from dba_tab_privs where grantee='PUBLIC' and table_name in ('DBMS_LDAP','UTL_INADDR','UTL_TCP','UTL_MAIL','UTL_SMTP',
              'UTL_DBWS','UTL_ORAMTS','UTL_HTTP','HTTPURITYPE');
            remediacion: |
              Revisar los usuarios con privilegios “PUBLIC” y restringirlos tanto como sea posible.
            nota: >-
              Este control requiere remediación manual.
            type: "security"
            expected_count: "{{ cis_55_expected_count }}"
            actual_count: "{{ cis_55_count }}"
            sensitive_privileges: "{{ cis_55_sensitive_privileges }}"
            compliant_initial: "{{ cis_55_compliant_initial }}"
            compliant_final: "{{ cis_55_compliant_final }}"
            needs_remediation: "{{ cis_55_needs_remediation }}"
            was_remediated: "{{ cis_55_was_remediated }}"
