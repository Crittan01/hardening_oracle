---
- name: CIS 72 - Verificación del directorio trace en ORACLE_HOME/network
  block:
    # Definiciones básicas
    - name: (Check - CIS 72) - Definiciones y variables
      ansible.builtin.set_fact:
        cis_72_trace_dir: "{{ hardening_oracle_home }}/network/trace"
        cis_72_valid_pattern: "^ora[a-zA-Z0-9]{3,4}$"
        cis_72_invalid_users: ["oracle"]
        cis_72_explict_valid_users: ["grid"]
        cis_72_valid_groups: ["dba", "oinstall", "asmdba"]
        cis_72_instance_user_valid: "{{
          hardening_current_user is match('^ora[a-zA-Z0-9]{3,4}$') and
          hardening_current_user != 'oracle' or
          hardening_current_user in ['grid'] }}"

    # Verificar existencia y propiedades del directorio trace
    - name: (Check - CIS 72) - Verificar directorio trace
      ansible.builtin.stat:
        path: "{{ cis_72_trace_dir }}"
        get_attributes: true
      register: cis_72_trace_dir_stat
      become: true

    # Evaluar cumplimiento
    - name: (Check - CIS 72) - Evaluar cumplimiento
      ansible.builtin.set_fact:
        cis_72_dir_exists: "{{ cis_72_trace_dir_stat.stat.exists | default(false) }}"
        cis_72_dir_owner: "{{ cis_72_trace_dir_stat.stat.pw_name | default('N/A') if cis_72_trace_dir_stat.stat.exists | default(false) else 'N/A' }}"
        cis_72_dir_group: "{{ cis_72_trace_dir_stat.stat.gr_name | default('N/A') if cis_72_trace_dir_stat.stat.exists | default(false) else 'N/A' }}"
        cis_72_dir_mode: "{{ cis_72_trace_dir_stat.stat.mode | default('N/A') if cis_72_trace_dir_stat.stat.exists | default(false) else 'N/A' }}"
        cis_72_owner_valid: "{{
          cis_72_trace_dir_stat.stat.exists | default(false) and
          ((cis_72_trace_dir_stat.stat.pw_name is match(cis_72_valid_pattern) and
          cis_72_trace_dir_stat.stat.pw_name not in cis_72_invalid_users) or
          cis_72_trace_dir_stat.stat.pw_name in cis_72_explict_valid_users) }}"
        cis_72_owner_matches_instance: "{{
          cis_72_trace_dir_stat.stat.exists | default(false) and
          cis_72_trace_dir_stat.stat.pw_name == hardening_current_user }}"
        cis_72_group_valid: "{{
          cis_72_trace_dir_stat.stat.exists | default(false) and
          cis_72_trace_dir_stat.stat.gr_name in cis_72_valid_groups }}"
        cis_72_perms_valid: "{{
          cis_72_trace_dir_stat.stat.exists | default(false) and
          (cis_72_trace_dir_stat.stat.mode | regex_replace('^0', '') | int(base=8) <= 0o750) }}"

    # Establecer estado general
    - name: (Check - CIS 72) - Establecer estado general
      ansible.builtin.set_fact:
        cis_72_compliant_initial: "{{
          cis_72_dir_exists and
          cis_72_owner_valid and
          cis_72_owner_matches_instance and
          cis_72_group_valid and
          cis_72_perms_valid }}"
        cis_72_compliant_final: "{{
          cis_72_dir_exists and
          cis_72_owner_valid and
          cis_72_owner_matches_instance and
          cis_72_group_valid and
          cis_72_perms_valid }}"
        cis_72_was_remediated: false

    # Mostrar resultados para depuración
    - name: (Check - CIS 72) - Mostrar resultados
      ansible.builtin.debug:
        msg:
          - "Instancia: {{ hardening_current_instance }}"
          - "Directorio de trace: {{ cis_72_trace_dir }}"
          - "¿Directorio existe?: {{ cis_72_dir_exists }}"
          - "Propietario: {{ cis_72_dir_owner }}"
          - "Grupo: {{ cis_72_dir_group }}"
          - "Permisos: {{ cis_72_dir_mode }}"
          - "Estado de cumplimiento: {{ cis_72_compliant_initial }}"
        verbosity: 1

    # Agregar resultados a la lista global
    - name: Agregar resultados a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_72] }}"
      vars:
        instance_result_cis_72:
          instance_name: "{{ hardening_current_instance }}"
          cis_72:
            parametro: "Directorio Oracle network/trace"
            description: "Verifica y limita los permisos del directorio donde se almacenan los archivos de trace de Oracle"
            implementacion: |
              El directorio $ORACLE_HOME/network/trace debe existir, pertenecer al
              usuario de la instancia y tener permisos restringidos (0750 o más restrictivos).
            verificacion: >-
              La verificación consiste en comprobar que el directorio "trace" existe en
              $ORACLE_HOME/network/ y que sus permisos son iguales o inferiores a 750.
            objetivo: >-
              Garantizar que el directorio donde Oracle almacena los archivos de trace
              tenga los permisos adecuados para mantener la seguridad de la información
              contenida en dichos archivos.
            commando: |
              ls -la $ORACLE_HOME/network/trace
            nota: >-
              Los permisos 0750 significan que solo el propietario tiene acceso de
              lectura, escritura y ejecución; el grupo tiene acceso de lectura y ejecución;
              y otros usuarios no tienen acceso en absoluto.
            type: "filesystem"
            trace_dir: "{{ cis_72_trace_dir }}"
            dir_exists: "{{ cis_72_dir_exists }}"
            dir_owner: "{{ cis_72_dir_owner }}"
            dir_group: "{{ cis_72_dir_group }}"
            dir_mode: "{{ cis_72_dir_mode }}"
            owner_valid: "{{ cis_72_owner_valid }}"
            owner_matches_instance: "{{ cis_72_owner_matches_instance }}"
            group_valid: "{{ cis_72_group_valid }}"
            perms_valid: "{{ cis_72_perms_valid }}"
            instance_user: "{{ hardening_current_user }}"
            instance_user_valid: "{{ cis_72_instance_user_valid }}"
            compliant_initial: "{{ cis_72_compliant_initial }}"
            compliant_final: "{{ cis_72_compliant_final }}"
            was_remediated: false
