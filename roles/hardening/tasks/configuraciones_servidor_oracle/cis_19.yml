---
- name: CIS 19 - Verificación de procedimientos externos en listener.ora y tnsnames.ora
  block:
    # Definiciones básicas
    - name: (Check - CIS 19) - Definiciones y variables
      ansible.builtin.set_fact:
        cis_19_files_to_check:
          - "{{ hardening_oracle_home }}/network/admin/listener.ora"
          - "{{ hardening_oracle_home }}/network/admin/tnsnames.ora"
        cis_19_search_pattern: "EXTPROC"
        cis_19_file_details: []
        cis_19_non_compliant_files: []
        cis_19_existing_files: []

    # Verificar la existencia de los archivos a evaluar
    - name: (Check - CIS 19) - Verificar existencia de archivo listener.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
      register: cis_19_listener_stat
      become: true
      become_user: "{{ hardening_current_user }}"

    - name: (Check - CIS 19) - Verificar existencia de archivo tnsnames.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/tnsnames.ora"
      register: cis_19_tnsnames_stat
      become: true
      become_user: "{{ hardening_current_user }}"

    # Crear lista de archivos existentes
    - name: (Check - CIS 19) - Agregar listener.ora a lista si existe
      ansible.builtin.set_fact:
        cis_19_existing_files: "{{ cis_19_existing_files + ['{{ hardening_oracle_home }}/network/admin/listener.ora'] }}"
      when: cis_19_listener_stat.stat.exists | default(false)

    - name: (Check - CIS 19) - Agregar tnsnames.ora a lista si existe
      ansible.builtin.set_fact:
        cis_19_existing_files: "{{ cis_19_existing_files + ['{{ hardening_oracle_home }}/network/admin/tnsnames.ora'] }}"
      when: cis_19_tnsnames_stat.stat.exists | default(false)

    # Buscar procedimientos externos en listener.ora
    - name: (Check - CIS 19) - Buscar EXTPROC en listener.ora
      ansible.builtin.shell: |
        set -o pipefail
        grep -n "{{ cis_19_search_pattern }}" "{{ hardening_oracle_home }}/network/admin/listener.ora" | grep -v "^#" || echo ""
      register: cis_19_listener_result
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ hardening_current_user }}"
      when: cis_19_listener_stat.stat.exists | default(false)

    # Buscar procedimientos externos en tnsnames.ora
    - name: (Check - CIS 19) - Buscar EXTPROC en tnsnames.ora
      ansible.builtin.shell: |
        set -o pipefail
        grep -n "{{ cis_19_search_pattern }}" "{{ hardening_oracle_home }}/network/admin/tnsnames.ora" | grep -v "^#" || echo ""
      register: cis_19_tnsnames_result
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ hardening_current_user }}"
      when: cis_19_tnsnames_stat.stat.exists | default(false)

    # Procesar resultado de listener.ora
    - name: (Check - CIS 19) - Procesar resultado de listener.ora
      ansible.builtin.set_fact:
        cis_19_listener_entries: "{{ cis_19_listener_result.stdout.split('\n') | select('regex', '\\S') | list }}"
        cis_19_file_details: "{{ cis_19_file_details + [{
          'path': hardening_oracle_home + '/network/admin/listener.ora',
          'filename': 'listener.ora',
          'extproc_entries': cis_19_listener_result.stdout.split('\n')
          | select('regex', '\\S') | list, 'entry_count': (cis_19_listener_result.stdout.split('\n')
          | select('regex', '\\S') | list | length), 'compliant': (cis_19_listener_result.stdout.split('\n')
          | select('regex', '\\S') | list | length) == 0}] }}"
      when: cis_19_listener_stat.stat.exists | default(false)

    # Procesar resultado de tnsnames.ora
    - name: (Check - CIS 19) - Procesar resultado de tnsnames.ora
      ansible.builtin.set_fact:
        cis_19_tnsnames_entries: "{{ cis_19_tnsnames_result.stdout.split('\n') | select('regex', '\\S') | list }}"
        cis_19_file_details: "{{ cis_19_file_details + [{
          'path': hardening_oracle_home + '/network/admin/tnsnames.ora',
          'filename': 'tnsnames.ora', 'extproc_entries': cis_19_tnsnames_result.stdout.split('\n')
          | select('regex', '\\S') | list, 'entry_count': (cis_19_tnsnames_result.stdout.split('\n')
          | select('regex', '\\S') | list | length), 'compliant': (cis_19_tnsnames_result.stdout.split('\n')
          | select('regex', '\\S') | list | length) == 0}] }}"
      when: cis_19_tnsnames_stat.stat.exists | default(false)

    # Identificar archivos no conformes
    - name: (Check - CIS 19) - Identificar archivos no conformes
      ansible.builtin.set_fact:
        cis_19_non_compliant_files: "{{ cis_19_non_compliant_files + [file_item] }}"
      loop: "{{ cis_19_file_details }}"
      loop_control:
        loop_var: file_item
      when: file_item.entry_count > 0

    # Establecer estado general
    - name: (Check - CIS 19) - Establecer estado general
      ansible.builtin.set_fact:
        cis_19_compliant_initial: "{{ cis_19_non_compliant_files | length == 0 }}"
        cis_19_compliant_final: "{{ cis_19_non_compliant_files | length == 0 }}"
        cis_19_was_remediated: false

    # Mostrar resultados para depuración
    - name: (Check - CIS 19) - Mostrar resultados
      ansible.builtin.debug:
        msg:
          - "Instancia: {{ hardening_current_instance }}"
          - "Archivos evaluados: {{ cis_19_file_details | map(attribute='filename') | list }}"
          - "Archivos no conformes: {{ cis_19_non_compliant_files | map(attribute='filename') | list }}"
          - "Estado de cumplimiento: {{ cis_19_compliant_initial }}"
        verbosity: 1

    # Agregar resultados a la lista global
    - name: Agregar resultados a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_19] }}"
      vars:
        instance_result_cis_19:
          instance_name: "{{ hardening_current_instance }}"
          cis_19:
            parametro: "listener.ora, tnsnames.ora - Procedimientos externos"
            description: "Remover las entradas para los procedimientos externos en los archivos listener.ora y tnsnames.ora"
            implementacion: |
              Comentar o eliminar las entradas que contengan EXTPROC en los archivos
              listener.ora y tnsnames.ora para evitar la ejecución de procedimientos externos
              no autorizados.
            verificacion: >-
              Verificar que NO exista ninguna línea activa (no comentada) que contenga el texto 'EXTPROC'
              en los archivos listener.ora y tnsnames.ora.
            objetivo: >-
              Comentar posibles entradas de procedimientos externos que puedan representar un riesgo de
              seguridad, limitando la capacidad de llamar a librerías compartidas desde fuera del
              entorno controlado de Oracle.
            commando: |
              grep EXTPROC $ORACLE_HOME/network/admin/listener.ora | grep -v "^#"
              grep EXTPROC $ORACLE_HOME/network/admin/tnsnames.ora | grep -v "^#"
            nota: >-
              Los procedimientos externos pueden llamar librerías compartidas en el sistema que se encuentren
              en la ruta $ORACLE_HOME/lib o $ORACLE_HOME/bin, lo que podría representar un riesgo de seguridad
              si no está adecuadamente controlado.
            type: "configuration"
            files_checked: "{{ cis_19_file_details | map(attribute='filename') | list }}"
            file_details: "{{ cis_19_file_details }}"
            non_compliant_files: "{{ cis_19_non_compliant_files }}"
            compliant_initial: "{{ cis_19_compliant_initial }}"
            compliant_final: "{{ cis_19_compliant_final }}"
            was_remediated: false
