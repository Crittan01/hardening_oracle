---
- name: CIS 71 - Verificación de permisos en archivo sqlnet.ora
  block:
    # Definiciones básicas
    - name: (Check - CIS 71) - Definiciones y variables
      ansible.builtin.set_fact:
        cis_71_target_file: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
        cis_71_valid_pattern: "^ora[a-zA-Z0-9]{3,4}$"
        cis_71_invalid_users: ["oracle"]
        cis_71_explict_valid_users: ["grid"] # Usuarios explícitamente válidos
        cis_71_valid_groups: ["dba", "oinstall", "asmdba"]
        cis_71_instance_user_valid: "{{
          hardening_current_user is match('^ora[a-zA-Z0-9]{3,4}$') and
          hardening_current_user != 'oracle' or
          hardening_current_user in ['grid'] }}"
        cis_71_file_details: []

    # Verificar archivo
    - name: (Check - CIS 71) - Verificar archivo sqlnet.ora
      ansible.builtin.stat:
        path: "{{ cis_71_target_file }}"
        get_attributes: true
      register: cis_71_file_stat
      become: true

    # Procesar resultados
    - name: (Check - CIS 71) - Procesar resultados
      ansible.builtin.set_fact:
        cis_71_file_exists: "{{ cis_71_file_stat.stat.exists | default(false) }}"
        cis_71_file_details: "{{ file_detail }}"
        cis_71_compliant: "{{ file_compliant if cis_71_file_stat.stat.exists | default(false) else false }}"
      vars:
        # Definir criterios de validación
        valid_owner: "{{ cis_71_file_stat.stat.exists and cis_71_file_stat.stat.pw_name == hardening_current_user }}"
        valid_naming: "{{
          cis_71_file_stat.stat.exists and
          (cis_71_file_stat.stat.pw_name is match(cis_71_valid_pattern) and cis_71_file_stat.stat.pw_name not in cis_71_invalid_users) or
          cis_71_file_stat.stat.pw_name in cis_71_explict_valid_users }}"
        valid_group: "{{ cis_71_file_stat.stat.exists and cis_71_file_stat.stat.gr_name in cis_71_valid_groups }}"
        valid_permission: "{{
          cis_71_file_stat.stat.exists and
          (cis_71_file_stat.stat.mode | regex_replace('^0', '') | int(base=8) <= 0o755) }}"
        # Determinar cumplimiento general
        file_compliant: "{{ cis_71_file_stat.stat.exists and valid_owner and valid_naming and valid_group and valid_permission }}"
        # Crear objeto con detalles
        file_detail:
          {
            "path": "{{ cis_71_target_file }}",
            "exists": "{{ cis_71_file_stat.stat.exists | default(false) }}",
            "owner": "{{ cis_71_file_stat.stat.pw_name if cis_71_file_stat.stat.exists else 'N/A' }}",
            "group": "{{ cis_71_file_stat.stat.gr_name if cis_71_file_stat.stat.exists else 'N/A' }}",
            "mode": "{{ cis_71_file_stat.stat.mode if cis_71_file_stat.stat.exists else 'N/A' }}",
            "owner_valid": "{{ valid_owner if cis_71_file_stat.stat.exists else false }}",
            "naming_valid": "{{ valid_naming if cis_71_file_stat.stat.exists else false }}",
            "group_valid": "{{ valid_group if cis_71_file_stat.stat.exists else false }}",
            "permission_valid": "{{ valid_permission if cis_71_file_stat.stat.exists else false }}",
            "compliant": "{{ file_compliant if cis_71_file_stat.stat.exists else false }}",
          }
      when: cis_71_file_stat.stat is defined

    # Establecer valores iniciales y finales
    - name: (Check - CIS 71) - Establecer estado general
      ansible.builtin.set_fact:
        cis_71_compliant_initial: "{{ cis_71_compliant | default(false) }}"
        cis_71_compliant_final: "{{ cis_71_compliant | default(false) }}"
        cis_71_was_remediated: false

    # Mostrar resultados para depuración
    - name: (Check - CIS 71) - Mostrar resultados
      ansible.builtin.debug:
        msg:
          - "Instancia: {{ hardening_current_instance }}"
          - "Archivo: {{ cis_71_target_file }}"
          - "Existe: {{ cis_71_file_exists }}"
          - "Estado de cumplimiento: {{ cis_71_compliant_initial }}"
          - "Detalles: {{ cis_71_file_details }}"
        verbosity: 1

    # Agregar resultados a la lista global
    - name: Agregar resultados a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_71] }}"
      vars:
        instance_result_cis_71:
          instance_name: "{{ hardening_current_instance }}"
          cis_71:
            parametro: "sqlnet.ora"
            description: "Verifique y configure permisos según sea necesario, con permisos de lectura para todo el mundo"
            implementacion: |
              El archivo sqlnet.ora debe tener permisos 755 o más restrictivos. Este archivo
              debe pertenecer al usuario que ejecuta la instancia (usuario que siga el patrón 'ora' + 3-4 caracteres
              o usuario 'grid') y a un grupo válido (dba, oinstall, asmdba).
            verificacion: >-
              Verificar los permisos y propiedad del archivo sqlnet.ora.
            objetivo: >-
              Asegurar que el archivo sqlnet.ora tenga permisos de acceso apropiados. Este archivo
              contiene la configuración para la comunicación entre el usuario y el servidor, incluyendo
              el nivel de cifrado requerido. Es necesario que tenga permisos de lectura para todos los usuarios.
            commando: |
              ls -la $ORACLE_HOME/network/admin/sqlnet.ora
            nota: "Los permisos 755 significan rwxr-xr-x (propietario: rwx, grupo: r-x, otros: r-x)"
            type: "filesystem"
            target_file: "{{ cis_71_target_file }}"
            file_details: "{{ cis_71_file_details }}"
            file_exists: "{{ cis_71_file_exists | default(false) }}"
            instance_user: "{{ hardening_current_user }}"
            instance_user_valid: "{{ cis_71_instance_user_valid }}"
            valid_pattern: "{{ cis_71_valid_pattern }}"
            explicit_valid_users: "{{ cis_71_explict_valid_users }}"
            valid_groups: "{{ cis_71_valid_groups }}"
            compliant_initial: "{{ cis_71_compliant_initial }}"
            compliant_final: "{{ cis_71_compliant_final }}"
            was_remediated: false
