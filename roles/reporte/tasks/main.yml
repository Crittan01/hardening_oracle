---
# tasks file for roles/reporte
- name: DEBUG - Verificar datos recibidos para el reporte
  ansible.builtin.debug:
    msg:
      - "Instancias: {{ reporte_all_instances }}"
      - "Información de instancias: {{ reporte_instances_info | to_nice_yaml }}"
      - "Datos de instancias: {{ reporte_instances_data | length }} registros"
  tags: always

- name: Establecer variables de compatibilidad para el reporte
  ansible.builtin.set_fact:
    reporte_hardening_oracle_usr: "{{ reporte_instances_info[reporte_all_instances[0]].user | default('oracle') }}"
    reporte_hardening_oracle_home: "{{ reporte_instances_info[reporte_all_instances[0]].home | default('/u01/app/oracle/product/19.0.0/dbhome_1') }}"
    reporte_hardening_oracle_base: "{{ reporte_instances_info[reporte_all_instances[0]].base | default('/u01/app/oracle') }}"
    reporte_hardening_oracle_grp: "oinstall"
  when: reporte_all_instances | length > 0
  tags: always

- name: Generar informe HTML usando el módulo template de Ansible
  ansible.builtin.template:
    src: "oracle_cis_report.j2"
    dest: "/Ansible/hardening_oracle/roles/reporte/files/cis_oracle_report_{{ inventory_hostname }}_{{ ansible_date_time.date }}.html"
    mode: "0755"
  vars:
    hostname: "{{ inventory_hostname }}"
    oracle_version_full_j2: "{{ oracle_version_full }}"
    date: "{{ ansible_date_time.date }}"
  delegate_to: server_ansible

# Mostrar ubicación del informe generado
- name: Mostrar ubicación del informe generado
  ansible.builtin.debug:
    msg: "Informe HTML generado en: /Ansible/hardening_oracle/roles/reporte/files/cis_oracle_report_{{ inventory_hostname }}_{{ ansible_date_time.date }}.html"
