# roles/hardening/tasks/autenticacion/cis_35.yml
---
- name: CIS 35 - Verificación de la complejidad de contraseña
  block:
    # Paso 1: Verificar perfiles sin función de verificación de contraseña
    - name: (Check - CIS 35) - Verificar perfiles sin función de verificación de contraseña
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT P.PROFILE || ',' || P.RESOURCE_NAME || ',' || P.LIMIT
        FROM DBA_PROFILES P
        WHERE DECODE(P.LIMIT, 'DEFAULT',(SELECT LIMIT FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME = P.RESOURCE_NAME), LIMIT) = 'NULL'
        AND P.RESOURCE_NAME = 'PASSWORD_VERIFY_FUNCTION'
        AND EXISTS (SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE);
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_35_profiles_result
      changed_when: false
      failed_when: false

    # Paso 2: Contar perfiles sin función de verificación de contraseña
    - name: (Check - CIS 35) - Contar perfiles sin función de verificación
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT COUNT(*)
        FROM DBA_PROFILES P
        WHERE DECODE(P.LIMIT, 'DEFAULT',(SELECT LIMIT FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME = P.RESOURCE_NAME), LIMIT) = 'NULL'
        AND P.RESOURCE_NAME = 'PASSWORD_VERIFY_FUNCTION'
        AND EXISTS (SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE);
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_35_count_result
      changed_when: false
      failed_when: false

    # Paso 3: Verificar específicamente el perfil DEFAULT
    - name: (Check - CIS 35) - Verificar el perfil DEFAULT
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT LIMIT FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME = 'PASSWORD_VERIFY_FUNCTION';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_35_default_profile_result
      changed_when: false
      failed_when: false

    # Paso 4: Procesar los resultados
    - name: (Check - CIS 35) - Procesar resultados
      ansible.builtin.set_fact:
        cis_35_count: "{{ cis_35_count_result.stdout | trim | int }}"
        cis_35_profile_rows: "{{ cis_35_profiles_result.stdout_lines | select('match', '.+,.+,.+') | list }}"
        cis_35_default_profile_value: "{{ cis_35_default_profile_result.stdout | trim }}"
        cis_35_expected_count: 0

    # Paso 5: Estructurar datos de perfiles encontrados
    - name: (Check - CIS 35) - Inicializar variables
      ansible.builtin.set_fact:
        cis_35_noncompliant_profiles: []

    # Paso 6: Estructurar datos de perfiles encontrados si existen
    - name: (Check - CIS 35) - Estructurar datos de perfiles encontrados
      ansible.builtin.set_fact:
        cis_35_noncompliant_profiles:
          "{{ cis_35_noncompliant_profiles | default([]) +
          [{'profile': profile_item.split(',')[0] | trim,
          'resource': profile_item.split(',')[1] | trim,
          'limit': profile_item.split(',')[2] | trim,
          'remediacion': 'ALTER PROFILE ' + profile_item.split(',')[0] | trim + ' LIMIT PASSWORD_VERIFY_FUNCTION ora12c_strong_verify_function;'}] }}"
      loop: "{{ cis_35_profile_rows }}"
      loop_control:
        loop_var: profile_item
      when: cis_35_profile_rows | length > 0

    # Paso 7: Verificar si el perfil DEFAULT está en la lista de no conformes
    - name: (Check - CIS 35) - Verificar si el perfil DEFAULT está en la lista
      ansible.builtin.set_fact:
        cis_35_default_profile_noncompliant: "{{ cis_35_default_profile_value == 'NULL' }}"

    # Paso 8: Determinar estado de conformidad
    - name: (Check - CIS 35) - Determinar estado de conformidad
      ansible.builtin.set_fact:
        cis_35_compliant_initial: "{{ cis_35_count | int == 0 }}"

    # Paso 9: Mostrar resultados para depuración
    - name: (Check - CIS 35) - Mostrar resultado de verificación
      ansible.builtin.debug:
        msg:
          - "Número de perfiles sin verificación de contraseña: {{ cis_35_count }}"
          - "Perfiles no conformes: {{ cis_35_noncompliant_profiles | length }}"
          - "¿Perfil DEFAULT no conforme?: {{ cis_35_default_profile_noncompliant }}"
          - "Estado de conformidad: {{ cis_35_compliant_initial }}"
        verbosity: 0

    # Paso 10: No hay remediación automática para este control, solo indicar si se requiere
    - name: (Check - CIS 35) - Determinar si se requiere remediación manual
      ansible.builtin.set_fact:
        cis_35_needs_remediation: "{{ not cis_35_compliant_initial }}"
        cis_35_compliant_final: "{{ cis_35_compliant_initial }}" # Sin remediación automática, el estado final = inicial
        cis_35_was_remediated: false

    # Paso 11: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 35 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_35] }}"
      vars:
        instance_result_cis_35:
          instance_name: "{{ hardening_current_instance }}"
          cis_35:
            parametro: "Complejidad de Contraseña"
            description: >-
              Las contraseñas asignadas para las cuentas de usuario deben ser complejas.
              Oracle ofrece una funcionalidad para verificar la complejidad de contraseña.
            implementacion: |
              Modificar el perfil DEFAULT para establecer la función de verificación de contraseña:

              ALTER PROFILE DEFAULT LIMIT
              PASSWORD_VERIFY_FUNCTION ora12c_strong_verify_function;
            verificacion: >-
              Verificar si todos los perfiles tienen la función de complejidad de la contraseña:
              SELECT P.PROFILE, P.RESOURCE_NAME, P.LIMIT FROM DBA_PROFILES P WHERE DECODE(P.LIMIT, 'DEFAULT',
              (SELECT LIMIT FROM DBA_PROFILES WHERE PROFILE='DEFAULT' AND RESOURCE_NAME = P.RESOURCE_NAME), LIMIT) = 'NULL'
              AND P.RESOURCE_NAME = 'PASSWORD_VERIFY_FUNCTION' AND EXISTS ( SELECT 'X' FROM DBA_USERS U WHERE U.PROFILE = P.PROFILE );
            remediacion: |
              Ejecutar para cada perfil no conforme (especialmente el perfil DEFAULT):
              <br>Alter profile DEFAULT limit PASSWORD_VERIFY_FUNCTION ora12c_strong_verify_function;
            nota: >-
              Este control requiere remediación manual. Se debe establecer la función de verificación de contraseña para cada perfil no conforme.
            type: "security"
            expected_count: "{{ cis_35_expected_count }}"
            actual_count: "{{ cis_35_count }}"
            noncompliant_profiles: "{{ cis_35_noncompliant_profiles }}"
            default_profile_noncompliant: "{{ cis_35_default_profile_noncompliant }}"
            default_profile_value: "{{ cis_35_default_profile_value }}"
            compliant_initial: "{{ cis_35_compliant_initial }}"
            compliant_final: "{{ cis_35_compliant_final }}"
            needs_remediation: "{{ cis_35_needs_remediation }}"
            was_remediated: "{{ cis_35_was_remediated }}"
