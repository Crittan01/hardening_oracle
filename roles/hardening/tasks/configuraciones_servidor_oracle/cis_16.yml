# roles/hardening/tasks/configuraciones_servidor_oracle/cis_16.yml
---
- name: CIS 16 - Verificación de sqlnet.expire_time
  block:
    # Paso 1: Verificar la existencia del archivo sqlnet.ora
    - name: (Check - CIS 16) - Comprobar si existe el archivo sqlnet.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
      register: cis_16_sqlnet_file
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 2: Verificar el valor actual de sqlnet.expire_time=
    - name: (Check - CIS 16) - Leer el valor actual de sqlnet.expire_time=
      ansible.builtin.shell: |
        set -o pipefail
        grep -i "sqlnet.expire_time=" {{ hardening_oracle_home }}/network/admin/sqlnet.ora | grep -v "^#" | awk -F= '{print $2}' | tr -d ' '
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_16_timeout_result
      changed_when: false
      failed_when: false
      when: cis_16_sqlnet_file.stat.exists

    # Paso 3: Procesar el resultado y establecer banderas si el archivo existe
    - name: (Check - CIS 16) - Procesar resultado
      ansible.builtin.set_fact:
        cis_16_file_exists: "{{ cis_16_sqlnet_file.stat.exists }}"
        cis_16_param_exists: "{{ cis_16_timeout_result.stdout | default('') | trim != '' }}"
        cis_16_param_value: "{{ cis_16_timeout_result.stdout | default('') | trim }}"
      when: cis_16_sqlnet_file.stat.exists

    # Paso 4: Establecer valores por defecto si el archivo no existe
    - name: (Check - CIS 16) - Establecer valores por defecto si el archivo no existe
      ansible.builtin.set_fact:
        cis_16_file_exists: false
        cis_16_param_exists: false
        cis_16_param_value: ""
      when: not cis_16_sqlnet_file.stat.exists | default(false)

    # Paso 5: Establecer el valor esperado y determinar cumplimiento
    - name: (Check - CIS 16) - Establecer valor esperado y determinar cumplimiento
      ansible.builtin.set_fact:
        cis_16_expected_value: "10"
        cis_16_compliant_initial: "{{ cis_16_file_exists and cis_16_param_exists and cis_16_param_value == '10' }}"

    # Paso 6: Debug para mostrar la información detectada
    - name: (Check - CIS 16) - Mostrar información detectada
      ansible.builtin.debug:
        msg:
          - "Archivo sqlnet.ora existe: {{ cis_16_file_exists }}"
          - "Parámetro sqlnet.expire_time= existe: {{ cis_16_param_exists }}"
          - "Valor actual: {{ cis_16_param_value }}"
          - "Valor esperado: {{ cis_16_expected_value }}"
          - "Estado de cumplimiento: {{ cis_16_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 16) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_16_needs_remediation: "{{ not cis_16_compliant_initial }}"

    # Paso 8: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 16) - Configurar sqlnet.expire_time=
      when: cis_16_needs_remediation
      block:
        # Paso 8.1: Crear una copia de seguridad del archivo sqlnet.ora si existe
        - name: (Remediation - CIS 16) - Crear copia de seguridad de sqlnet.ora
          ansible.builtin.copy:
            src: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            dest: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora.{{ ansible_date_time.date }}"
            remote_src: true
            mode: "{{ cis_16_sqlnet_file.stat.mode }}"
            owner: "{{ cis_16_sqlnet_file.stat.pw_name }}"
            group: "{{ cis_16_sqlnet_file.stat.gr_name }}"
          become: true
          become_user: root
          when: cis_16_file_exists

        # Paso 8.2: Crear el archivo sqlnet.ora si no existe
        - name: (Remediation - CIS 16) - Crear el archivo sqlnet.ora si no existe
          ansible.builtin.file:
            path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            state: touch
            owner: "{{ hardening_current_user }}"
            group: "{{ hardening_oracle_grp }}"
            mode: "0644"
          become: true
          become_user: root
          when: not cis_16_file_exists

        # Paso 8.3: Agregar o actualizar el parámetro en el archivo
        - name: (Remediation - CIS 16) - Configurar parámetro sqlnet.expire_time=
          ansible.builtin.lineinfile:
            path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            regexp: "^\\s*sqlnet.expire_time\\s*="
            line: "sqlnet.expire_time={{ cis_16_expected_value }}"
            state: present
            backup: false
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_16_remediation_result

        # Paso 8.4: Mostrar mensaje informativo sobre reinicio pendiente
        - name: (Remediation - CIS 16) - Informar sobre reinicio pendiente
          ansible.builtin.debug:
            msg: "NOTA: Se ha modificado el parámetro sqlnet.expire_time={{ cis_16_expected_value }}"

        # Paso 8.5: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 16) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_16_was_remediated: true
            cis_16_compliant_final: true
            cis_16_remediated_value: "{{ cis_16_expected_value }}"

    # Paso 9: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 16) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_16_was_remediated: false
        cis_16_compliant_final: "{{ cis_16_compliant_initial }}"
        cis_16_remediated_value: "{{ cis_16_param_value }}"
      when: not cis_16_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 16 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_16] }}"
      vars:
        instance_result_cis_16:
          instance_name: "{{ hardening_current_instance }}"
          cis_16:
            parametro: "sqlnet.expire_time"
            description: >-
              Permite especificar un intervalo de tiempo tras el cual se verifica si las comunicaciones establecidas con el cliente se encuentran activas.
              Si no se encuentran activas, se genera un error que es procesado por la base de datos para terminar la conexión.
            implementacion: |
              En el archivo sqlnet.ora, configurar el siguiente parámetro:
              sqlnet.sqlnet.expire_time={{ cis_16_expected_value }}
            verificacion: >-
              Verificar la configuración establecida con el comando:
              grep -i sqlnet.expire_time sqlnet.ora
            commando: |
              cd $ORACLE_HOME/network/admin
              grep -i sqlnet.expire_time sqlnet.ora
            nota: >-
              La configuración de este valor en un nivel muy bajo puede ocasionar que los usuarios no se conecten a la base de datos.
              Se debe aplicar el valor recomendado e ir aumentándolo hasta que opere correctamente.
            type: "network"
            file_exists: "{{ cis_16_file_exists }}"
            param_exists: "{{ cis_16_param_exists }}"
            param_value: "{{ cis_16_param_value }}"
            expected_value: "{{ cis_16_expected_value }}"
            remediated_value: "{{ cis_16_remediated_value | default(cis_16_param_value) }}"
            compliant_initial: "{{ cis_16_compliant_initial }}"
            compliant_final: "{{ cis_16_compliant_final }}"
            was_remediated: "{{ cis_16_was_remediated }}"
