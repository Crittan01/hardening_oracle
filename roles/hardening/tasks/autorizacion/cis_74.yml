# roles/hardening/tasks/configuraciones_servidor_oracle/cis_74.yml
---
- name: CIS 74 - Verificación de trace_directory
  block:
    # Paso 1: Verificar la existencia del archivo listener.ora
    - name: (Check - CIS 74) - Comprobar si existe el archivo listener.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
      register: cis_74_listener_file
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 2: Verificar el valor actual de trace_directory
    - name: (Check - CIS 74) - Leer el valor actual de trace_directory
      ansible.builtin.shell: |
        grep -i "trace_directory" {{ hardening_oracle_home }}/network/admin/listener.ora | grep -v "^#" | awk -F= '{print $2}' | tr -d ' '
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_74_timeout_result
      changed_when: false
      failed_when: false
      ignore_errors: true
      when: cis_74_listener_file.stat.exists

    # Paso 3: Procesar el resultado y establecer banderas si el archivo existe
    - name: (Check - CIS 74) - Procesar resultado
      ansible.builtin.set_fact:
        cis_74_file_exists: "{{ cis_74_listener_file.stat.exists }}"
        cis_74_param_exists: "{{ cis_74_timeout_result.stdout | default('') | trim != '' }}"
        cis_74_param_value: "{{ cis_74_timeout_result.stdout | default('') | trim }}"
      when: cis_74_listener_file.stat.exists

    # Paso 4: Establecer banderas si el archivo no existe
    - name: (Check - CIS 74) - Establecer banderas si el archivo no existe
      ansible.builtin.set_fact:
        cis_74_file_exists: false
        cis_74_param_exists: false
        cis_74_param_value: ""
      when: not cis_74_listener_file.stat.exists | default(false)

    # Paso 5: Establecer el valor esperado y determinar cumplimiento
    - name: (Check - CIS 74) - Establecer valor esperado y determinar cumplimiento
      ansible.builtin.set_fact:
        cis_74_expected_value: "$ORACLE_HOME/network/trace"
        cis_74_compliant_initial: "{{ cis_74_file_exists and cis_74_param_exists and cis_74_param_value == '$ORACLE_HOME/network/trace' }}"

    # Paso 6: Debug para mostrar la información detectada
    - name: (Check - CIS 74) - Mostrar información detectada
      ansible.builtin.debug:
        msg:
          - "Archivo listener.ora existe: {{ cis_74_file_exists }}"
          - "Parámetro trace_directory existe: {{ cis_74_param_exists }}"
          - "Valor actual: {{ cis_74_param_value }}"
          - "Valor esperado: {{ cis_74_expected_value }}"
          - "Estado de cumplimiento: {{ cis_74_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 74) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_74_needs_remediation: "{{ not cis_74_compliant_initial }}"

    # Paso 8: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 74) - Configurar trace_directory
      when: cis_74_needs_remediation
      block:
        # Paso 8.1: Crear una copia de seguridad del archivo listener.ora si existe
        - name: (Remediation - CIS 74) - Crear copia de seguridad de listener.ora
          ansible.builtin.copy:
            src: "{{ hardening_oracle_home }}/network/admin/listener.ora"
            dest: "{{ hardening_oracle_home }}/network/admin/listener.ora.{{ ansible_date_time.date }}"
            remote_src: true
            mode: "{{ cis_74_listener_file.stat.mode }}"
            owner: "{{ cis_74_listener_file.stat.pw_name }}"
            group: "{{ cis_74_listener_file.stat.gr_name }}"
          become: true
          become_user: "{{ hardening_current_user }}"
          when: cis_74_file_exists

        # Paso 8.2: Crear el archivo listener.ora si no existe
        - name: (Remediation - CIS 74) - Crear el archivo listener.ora si no existe
          ansible.builtin.file:
            path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
            state: touch
            owner: "{{ hardening_current_user }}"
            group: "{{ hardening_oracle_grp }}"
            mode: "0644"
          become: true
          become_user: root
          when: not cis_74_file_exists

        # Paso 8.3: Agregar o actualizar el parámetro en el archivo
        - name: (Remediation - CIS 74) - Configurar parámetro trace_directory
          ansible.builtin.lineinfile:
            path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
            regexp: "^\\s*trace_directory\\s*="
            line: "trace_directory=$ORACLE_HOME/network/trace"
            state: present
            backup: false
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_74_remediation_result

        # Paso 8.4: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 74) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_74_was_remediated: true
            cis_74_compliant_final: true
            cis_74_remediated_value: "{{ cis_74_expected_value }}"

    # Paso 9: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 74) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_74_was_remediated: false
        cis_74_compliant_final: "{{ cis_74_compliant_initial }}"
        cis_74_remediated_value: "{{ cis_74_param_value }}"
      when: not cis_74_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 74 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_74] }}"
      vars:
        instance_result_cis_74:
          instance_name: "{{ hardening_current_instance }}"
          cis_74:
            parametro: "trace_directory"
            description: >-
              Establece el tiempo en segundos, en el cual el cliente debe realizar la solicitud de conexión al listener,
              después de que la conexión de red ha sido establecida.
            implementacion: |
              En el archivo Listener.ora, configurar el siguiente parámetro:
              trace_directory=$ORACLE_HOME/network/trace
            verificacion: >-
              Verificar la configuración establecida abriendo el archivo listener.ora y verifique el parámetro indicado en la implementación.
            commando: |
              cd $ORACLE_HOME/network/admin
              grep -i trace_directory listener.ora
            nota: >-
              La configuración de este valor en un nivel muy bajo puede ocasionar que los usuarios no se conecten a la base de datos.
              Se debe aplicar el valor recomendado e ir aumentándolo hasta que opere correctamente.
            type: "network"
            file_exists: "{{ cis_74_file_exists }}"
            param_exists: "{{ cis_74_param_exists }}"
            param_value: "{{ cis_74_param_value }}"
            expected_value: "{{ cis_74_expected_value }}"
            remediated_value: "{{ cis_74_remediated_value | default(cis_74_param_value) }}"
            compliant_initial: "{{ cis_74_compliant_initial }}"
            compliant_final: "{{ cis_74_compliant_final }}"
            was_remediated: "{{ cis_74_was_remediated }}"
