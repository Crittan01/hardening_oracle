# roles/hardening/tasks/configuraciones_servidor_oracle/cis_27.yml
---
- name: CIS 27 - Verificación de sec_user_unauthorized_access_banner
  block:
    # Variables específicas para el banner de acceso no autorizado
    - name: (Check - CIS 27) - Definir variables para el banner
      ansible.builtin.set_fact:
        cis_27_warning_path: "{{ hardening_oracle_home }}/network/admin"
        cis_27_warning_file: "warning.txt"
        cis_27_warning_full_path: "{{ hardening_oracle_home }}/network/admin/warning.txt"
        cis_27_warning_message: |
          ADVERTENCIA: Este sistema está restringido a usuarios autorizados.
          El acceso a esta Base de Datos NO esta autorizado.

    # Paso 1: Verificar la existencia del archivo sqlnet.ora
    - name: (Check - CIS 27) - Comprobar si existe el archivo sqlnet.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
      register: cis_27_sqlnet_file
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 2: Verificar el valor actual del parámetro en sqlnet.ora si existe
    - name: (Check - CIS 27) - Verificar valor actual de sec_user_unauthorized_access_banner
      ansible.builtin.shell: >-
        . ~/.bash_profile && grep -i "sec_user_unauthorized_access_banner" {{ hardening_oracle_home }}/network/admin/sqlnet.ora || echo "No encontrado"
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_27_grep_result
      changed_when: false
      when: cis_27_sqlnet_file.stat.exists

    # Paso 3: Verificar la existencia del archivo de advertencia
    - name: (Check - CIS 27) - Comprobar si existe el archivo de banner
      ansible.builtin.stat:
        path: "{{ cis_27_warning_full_path }}"
      register: cis_27_warning_file_stat
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 4: Procesar los resultados y determinar conformidad
    - name: (Check - CIS 27) - Procesar resultados
      ansible.builtin.set_fact:
        cis_27_sqlnet_exists: "{{ cis_27_sqlnet_file.stat.exists | default(false) }}"
        cis_27_param_exists:
          "{{ 'No encontrado' not in cis_27_grep_result.stdout | default('No encontrado')
          if cis_27_sqlnet_file.stat.exists | default(false) else false }}"
        cis_27_param_value:
          "{{ cis_27_grep_result.stdout.split('=')[1] | trim if 'No encontrado' not in cis_27_grep_result.stdout | default('No encontrado')
          and cis_27_sqlnet_file.stat.exists | default(false) else 'No configurado' }}"
        cis_27_warning_exists: "{{ cis_27_warning_file_stat.stat.exists | default(false) }}"

    # Paso 5: Determinar el estado de cumplimiento inicial
    - name: (Check - CIS 27) - Determinar cumplimiento
      ansible.builtin.set_fact:
        cis_27_compliant_initial: "{{ cis_27_param_exists and cis_27_warning_exists }}"

    # Paso 6: Mostrar resultados para depuración
    - name: (Check - CIS 27) - Mostrar resultados iniciales
      ansible.builtin.debug:
        msg:
          - "Archivo sqlnet.ora existe: {{ cis_27_sqlnet_exists }}"
          - "Parámetro sec_user_unauthorized_access_banner configurado: {{ cis_27_param_exists }}"
          - "Valor actual: {{ cis_27_param_value }}"
          - "Archivo de banner existe: {{ cis_27_warning_exists }}"
          - "Estado de cumplimiento: {{ cis_27_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 27) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_27_needs_remediation: "{{ not cis_27_compliant_initial }}"

    # Paso 8: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 27) - Configurar sec_user_unauthorized_access_banner
      when: cis_27_needs_remediation
      block:
        # Paso 8.0: Obtener grupo principal del usuario
        - name: Obtener grupo principal del usuario
          ansible.builtin.shell: |
            set -o pipefail
            id -gn
          register: grp_princ
          changed_when: false
          become: true
          become_user: "{{ hardening_current_user }}"

        # Paso 8.1: Crear directorio para el archivo de banner si no existe
        - name: (Remediation - CIS 27) - Crear directorio para archivo de banner
          ansible.builtin.file:
            path: "{{ cis_27_warning_path }}"
            state: directory
            mode: "0755"
            owner: "{{ hardening_current_user }}"
            group: "{{ grp_princ.stdout | trim }}"
          become: true

        # Paso 8.2: Crear el archivo de banner con el mensaje
        - name: (Remediation - CIS 27) - Crear archivo de banner
          ansible.builtin.copy:
            content: "{{ cis_27_warning_message }}"
            dest: "{{ cis_27_warning_full_path }}"
            mode: "0644"
            owner: "{{ hardening_current_user }}"
            group: "{{ grp_princ.stdout | trim }}"
          become: true
          register: cis_27_warning_creation

        # Paso 8.3: Crear backup del archivo sqlnet.ora si existe
        - name: (Remediation - CIS 27) - Crear backup del archivo sqlnet.ora
          ansible.builtin.copy:
            src: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            dest: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora.{{ ansible_date_time.date }}"
            remote_src: true
            owner: "{{ hardening_current_user }}"
            group: "{{ grp_princ.stdout | trim }}"
            mode: "0644"
          become: true
          when: cis_27_sqlnet_exists

        # Paso 8.4: Crear el archivo sqlnet.ora si no existe
        - name: (Remediation - CIS 27) - Crear el archivo sqlnet.ora si no existe
          ansible.builtin.file:
            path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            state: touch
            mode: "{{ cis_27_sqlnet_file.stat.mode }}"
            owner: "{{ cis_27_sqlnet_file.stat.pw_name }}"
            group: "{{ cis_27_sqlnet_file.stat.gr_name }}"
          become: true
          when: not cis_27_sqlnet_exists

        # Paso 8.5: Configurar el parámetro en sqlnet.ora
        - name: (Remediation - CIS 27) - Configurar parámetro sec_user_unauthorized_access_banner
          ansible.builtin.lineinfile:
            path: "{{ hardening_oracle_home }}/network/admin/sqlnet.ora"
            regexp: "^\\s*sec_user_unauthorized_access_banner\\s*="
            line: "sec_user_unauthorized_access_banner={{ cis_27_warning_full_path }}"
            state: present
            backup: false
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_27_parameter_config

        # Paso 8.6: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 27) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_27_was_remediated: true
            cis_27_compliant_final: true
            cis_27_remediated_param_value: "{{ cis_27_warning_full_path }}"
            cis_27_remediated_warning_exists: true

    # Paso 9: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 27) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_27_was_remediated: false
        cis_27_compliant_final: "{{ cis_27_compliant_initial }}"
        cis_27_remediated_param_value: "{{ cis_27_param_value }}"
        cis_27_remediated_warning_exists: "{{ cis_27_warning_exists }}"
      when: not cis_27_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 27 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_27] }}"
      vars:
        instance_result_cis_27:
          instance_name: "{{ hardening_current_instance }}"
          cis_27:
            parametro: "sqlnet.ora - sec_user_unauthorized_access_banner"
            description: "Mensaje que se le presenta al usuario que ingresa al sistema, advirtiéndole las condiciones que implica el acceso al sistema."
            implementacion: |
              Configurar el siguiente parámetro:
              SEC_USER_UNAUTHORIZED_ACCESS_BANNER=/path/to/warning.txt

              El archivo warning.txt debe contener el mensaje que se quiere mostrar al usuario.
            verificacion: >-
              Verificar la configuración establecida abriendo el archivo sqlnet.ora y
              verifique el parámetro indicado en la implementación.
            commando: |
              cd $ORACLE_HOME/network/admin
              cat sqlnet.ora | grep -i sec_user_unauthorized_access_banner
            remediacion: |
              1. Crear archivo /opt/oracle/banner_unauthorized.txt con el mensaje de advertencia
              2. Configurar en sqlnet.ora:
              sec_user_unauthorized_access_banner=/opt/oracle/banner_unauthorized.txt
            nota: >-
              Este control implementa dos componentes: el archivo de mensaje de advertencia
              y el parámetro en sqlnet.ora que apunta a ese archivo.
            type: "parameter_file"
            sqlnet_exists: "{{ cis_27_sqlnet_exists }}"
            param_exists: "{{ cis_27_param_exists }}"
            param_value: "{{ cis_27_param_value }}"
            warning_exists: "{{ cis_27_warning_exists }}"
            warning_path: "{{ cis_27_warning_full_path }}"
            remediated_param_value: "{{ cis_27_remediated_param_value }}"
            remediated_warning_exists: "{{ cis_27_remediated_warning_exists }}"
            compliant_initial: "{{ cis_27_compliant_initial }}"
            compliant_final: "{{ cis_27_compliant_final }}"
            was_remediated: "{{ cis_27_was_remediated }}"
