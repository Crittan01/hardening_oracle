# roles/hardening/tasks/configuraciones_servidor_oracle/cis_22.yml
---
- name: CIS 22 - Verificación de sec_case_sensitive_logon
  block:
    # Paso 1: Verificar el valor actual del parámetro
    - name: (Check - CIS 22) - Verificar valor actual de sec_case_sensitive_logon
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select value from v\$parameter where name='sec_case_sensitive_logon';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_22_param_result
      changed_when: false

    # Paso 2: Procesar el valor obtenido
    - name: (Check - CIS 22) - Procesar valor del parámetro
      ansible.builtin.set_fact:
        cis_22_param_value: "{{ cis_22_param_result.stdout | trim | upper }}"

    # Paso 3: Establecer el valor esperado
    - name: (Check - CIS 22) - Establecer valor esperado
      ansible.builtin.set_fact:
        cis_22_expected_value: "TRUE"

    # Paso 4: Determinar el estado de cumplimiento inicial
    - name: (Check - CIS 22) - Determinar estado de cumplimiento
      ansible.builtin.set_fact:
        cis_22_compliant_initial: "{{ cis_22_param_value == cis_22_expected_value }}"

    # Paso 5: Mostrar resultados para depuración
    - name: (Check - CIS 22) - Mostrar resultados iniciales
      ansible.builtin.debug:
        msg:
          - "Valor actual de sec_case_sensitive_logon: {{ cis_22_param_value }}"
          - "Valor esperado: {{ cis_22_expected_value }}"
          - "Estado de cumplimiento: {{ cis_22_compliant_initial }}"
        verbosity: 0

    # Paso 6: Determinar si se requiere remediación
    - name: (Check - CIS 22) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_22_needs_remediation: "{{ not cis_22_compliant_initial }}"

    # Paso 7: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 22) - Configurar sec_case_sensitive_logon
      when: cis_22_needs_remediation
      block:
        # Paso 7.1: Aplicar la remediación
        - name: (Remediation - CIS 22) - Configurar sec_case_sensitive_logon con el valor correcto
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER SYSTEM SET sec_case_sensitive_logon=TRUE SCOPE=SPFILE SID='*';
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_22_remediation_result
          changed_when: "'System altered' in cis_22_remediation_result.stdout"

        # Paso 7.2: Verificar si se requiere reinicio
        - name: (Remediation - CIS 22) - Indicar que se requiere reiniciar la instancia
          ansible.builtin.debug:
            msg: "Se ha modificado el parámetro sec_case_sensitive_logon. Para la instancia {{ hardening_current_instance }}."

        # Paso 7.3: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 22) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_22_was_remediated: true
            cis_22_compliant_final: true
            cis_22_remediated_value: "{{ cis_22_expected_value }} (pendiente reinicio)"

    # Paso 8: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 22) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_22_was_remediated: false
        cis_22_compliant_final: "{{ cis_22_compliant_initial }}"
        cis_22_remediated_value: "{{ cis_22_param_value }}"
      when: not cis_22_needs_remediation | bool

    # Paso 9: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 22 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_22] }}"
      vars:
        instance_result_cis_22:
          instance_name: "{{ hardening_current_instance }}"
          cis_22:
            parametro: "sec_case_sensitive_logon"
            description: "Habilita a las bases de datos para reconocer passwords sensibles a mayúsculas y minúsculas."
            implementacion: |
              Configurar el siguiente parámetro:
              SEC_CASE_SENSITIVE_LOGON=TRUE
            verificacion: >-
              Verificar la configuración establecida abriendo el archivo init.ora y
              verifique el parámetro indicado en la implementación.
            commando: |
              SELECT name, value, DECODE(Value,'TRUE','Cumple','Revisar') ESTADO
              FROM v$parameter WHERE name='sec_case_sensitive_logon';
            remediacion: |
              ALTER SYSTEM SET sec_case_sensitive_logon=TRUE SCOPE=SPFILE SID='*';
            nota: >-
              Si fue remediado, <strong>se requiere reiniciar</strong> la instancia para que los cambios surtan efecto,
              ya que se ha configurado con SCOPE=SPFILE.
            type: "parameter"
            param_value: "{{ cis_22_param_value }}"
            expected_value: "{{ cis_22_expected_value }}"
            remediated_value: "{{ cis_22_remediated_value }}"
            compliant_initial: "{{ cis_22_compliant_initial }}"
            compliant_final: "{{ cis_22_compliant_final }}"
            was_remediated: "{{ cis_22_was_remediated }}"
