# roles/hardening/tasks/configuraciones_servidor_oracle/cis_10.yml
---
- name: CIS 10 - Verificación de remote_listener
  block:
    # Paso 1: Verificar si existe valor en remote_listener
    - name: (Check - CIS 10) - Verificar valor actual de remote_listener
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        select value from v\$parameter where name='remote_listener';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_10_remote_listener_result
      changed_when: false

    # Paso 2: Procesar el valor obtenido
    - name: (Check - CIS 10) - Procesar valor de remote_listener
      ansible.builtin.set_fact:
        cis_10_remote_listener_value: "{{ cis_10_remote_listener_result.stdout | trim }}"
        cis_10_remote_listener_is_empty: "{{ cis_10_remote_listener_result.stdout | trim == '' }}"

    # Paso 3: Establecer el valor esperado (cadena vacía)
    - name: (Check - CIS 10) - Establecer valor esperado
      ansible.builtin.set_fact:
        cis_10_expected_value: ""

    # Paso 4: Determinar el estado de cumplimiento inicial
    # El parámetro debe ser una cadena vacía para cumplir con el requisito
    - name: (Check - CIS 10) - Determinar estado de cumplimiento
      ansible.builtin.set_fact:
        cis_10_compliant_initial: "{{ cis_10_remote_listener_is_empty }}"

    # Paso 5: Debug avanzado para ayudar a diagnosticar problemas
    - name: (Check - CIS 10) - Debug de valores para comparación
      ansible.builtin.debug:
        msg:
          - "Valor remote_listener actual (texto): '{{ cis_10_remote_listener_value }}'"
          - "¿Es una cadena vacía?: {{ cis_10_remote_listener_is_empty }}"
          - "Valor esperado (cadena vacía): '{{ cis_10_expected_value }}'"
          - "Estado de cumplimiento: {{ cis_10_compliant_initial }}"
        verbosity: 0

    # Paso 6: Mostrar resultados para depuración
    - name: (Check - CIS 10) - Mostrar resultados iniciales
      ansible.builtin.debug:
        msg:
          - "Valor actual de remote_listener: '{{ cis_10_remote_listener_value }}'"
          - "Valor esperado: cadena vacía"
          - "Estado de cumplimiento: {{ cis_10_compliant_initial }}"
        verbosity: 0

    # Paso 7: Determinar si se requiere remediación
    - name: (Check - CIS 10) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_10_needs_remediation: "{{ not cis_10_compliant_initial }}"

    # Paso 8: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 10) - Configurar remote_listener
      when: cis_10_needs_remediation
      block:
        # Paso 8.1: Aplicar la remediación (establecer a cadena vacía)
        - name: (Remediation - CIS 10) - Configurar remote_listener a cadena vacía
          ansible.builtin.shell: |
            . ~/.bash_profile
            export ORACLE_SID={{ hardening_current_instance }}
            sqlplus -s / as sysdba << EOF
            {{ hardening_set_sqlplus }}
            SET FEEDBACK ON
            ALTER SYSTEM SET remote_listener='' SCOPE=SPFILE SID='*';
            EXIT;
            EOF
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_10_remediation_result
          changed_when: "'System altered' in cis_10_remediation_result.stdout"

        # Paso 8.2: Verificar si se requiere reinicio
        - name: (Remediation - CIS 10) - Indicar que se requiere reiniciar la instancia
          ansible.builtin.debug:
            msg: "Se ha modificado el parámetro remote_listener. Para la instancia {{ hardening_current_instance }}."

        # Paso 8.3: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 10) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_10_was_remediated: true
            cis_10_compliant_final: true
            cis_10_remediated_value: "(cadena vacía) (pendiente reinicio)"

    # Paso 9: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 10) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_10_was_remediated: false
        cis_10_compliant_final: "{{ cis_10_compliant_initial }}"
        cis_10_remediated_value: "{{ cis_10_remote_listener_value }}"
      when: not cis_10_needs_remediation | bool

    # Paso 10: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 10 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_10] }}"
      vars:
        instance_result_cis_10:
          instance_name: "{{ hardening_current_instance }}"
          cis_10:
            parametro: "remote_listener"
            description: "Evite el uso de un listener en una máquina remota separada de la instancia de la base de datos."
            implementacion: |
              En el archivo init.ora, configurar el siguiente parámetro:
              remote_listener = "" (Una cadena vacía)
            verificacion: >-
              Verificar la configuración establecida con el comando:
              select name, value from v$parameter where name='remote_listener' and value is not null;
            commando: |
              select name, value from v$parameter where name='remote_listener' and value is not null;
              select name, value, DECODE(Value,'','Cumple','Revisar') ESTADO from v$parameter where name='remote_listener';
            nota: Si fue remediado, <strong>se requiere reiniciar</strong> la instancia para que los cambios surtan efecto.
            type: "security"
            remote_listener_value: "{{ cis_10_remote_listener_value | default('') }}"
            remote_listener_is_empty: "{{ cis_10_remote_listener_is_empty }}"
            expected_value: "{{ cis_10_expected_value }}"
            remediated_value: "{{ cis_10_remediated_value | default(cis_10_remote_listener_value) }}"
            compliant_initial: "{{ cis_10_compliant_initial }}"
            compliant_final: "{{ cis_10_compliant_final }}"
            was_remediated: "{{ cis_10_was_remediated }}"
