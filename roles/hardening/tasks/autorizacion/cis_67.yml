---
- name: CIS 67 - Verificación del parámetro user_dump_dest y sus permisos
  block:
    # Definiciones básicas
    - name: (Check - CIS 67) - Definiciones y variables
      ansible.builtin.set_fact:
        cis_67_valid_pattern: "^ora[a-zA-Z0-9]{3,4}$"
        cis_67_invalid_users: ["oracle"]
        cis_67_explict_valid_users: ["grid"]
        cis_67_valid_groups: ["dba", "oinstall", "asmdba"]
        cis_67_instance_user_valid: "{{
          hardening_current_user is match('^ora[a-zA-Z0-9]{3,4}$') and
          hardening_current_user != 'oracle' or
          hardening_current_user in ['grid'] }}"
        cis_67_path_details: []
        cis_67_compliant_paths: []
        cis_67_non_compliant_paths: []

    # Obtener valor del parámetro user_dump_dest
    - name: (Check - CIS 67) - Obtener valor del parámetro user_dump_dest
      ansible.builtin.shell: |
        . ~/.bash_profile
        export ORACLE_SID={{ hardening_current_instance }}
        sqlplus -s / as sysdba << EOF
        {{ hardening_set_sqlplus }}
        SELECT value FROM v\$parameter WHERE name='user_dump_dest';
        EXIT;
        EOF
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_67_param_result
      changed_when: false

    # Procesar valor del parámetro
    - name: (Check - CIS 67) - Procesar valor del parámetro
      ansible.builtin.set_fact:
        cis_67_param_value: "{{ cis_67_param_result.stdout | trim }}"
        cis_67_param_configured: "{{ cis_67_param_result.stdout | trim | length > 0 }}"
        cis_67_paths: "{{ cis_67_param_result.stdout | trim | split(',') | map('trim') | list if cis_67_param_result.stdout | trim | length > 0 else [] }}"

    # Verificar permisos de cada directorio
    - name: (Check - CIS 67) - Verificar permisos de directorios
      ansible.builtin.stat:
        path: "{{ path_item }}"
        get_attributes: true
      register: cis_67_stat_results
      loop: "{{ cis_67_paths }}"
      loop_control:
        loop_var: path_item
      become: true
      when: cis_67_param_configured and cis_67_paths | length > 0

    # Procesar resultados
    - name: (Check - CIS 67) - Procesar resultados
      ansible.builtin.set_fact:
        cis_67_path_details: "{{ cis_67_path_details + [path_detail] }}"
        cis_67_compliant_paths: "{{ cis_67_compliant_paths + [dir_item.stat.path] if path_compliant else cis_67_compliant_paths }}"
        cis_67_non_compliant_paths: "{{ cis_67_non_compliant_paths + [path_detail] if not path_compliant else cis_67_non_compliant_paths }}"
      vars:
        # Definir criterios de validación
        valid_owner: "{{ dir_item.stat.exists and dir_item.stat.pw_name == hardening_current_user }}"
        valid_naming: "{{
          dir_item.stat.exists and
          (dir_item.stat.pw_name is match(cis_67_valid_pattern) and dir_item.stat.pw_name not in cis_67_invalid_users) or
          dir_item.stat.pw_name in cis_67_explict_valid_users }}"
        valid_group: "{{ dir_item.stat.exists and dir_item.stat.gr_name in cis_67_valid_groups }}"
        valid_permission: "{{
          dir_item.stat.exists and
          (dir_item.stat.mode | regex_replace('^0', '') | int(base=8) <= 0o750) }}"
        # Determinar cumplimiento general
        path_compliant: "{{ dir_item.stat.exists and valid_owner and valid_naming and valid_group and valid_permission }}"
        # Crear objeto con detalles
        path_detail:
          {
            "path": "{{ dir_item.stat.path }}",
            "exists": "{{ dir_item.stat.exists }}",
            "owner": "{{ dir_item.stat.pw_name if dir_item.stat.exists else 'N/A' }}",
            "group": "{{ dir_item.stat.gr_name if dir_item.stat.exists else 'N/A' }}",
            "mode": "{{ dir_item.stat.mode if dir_item.stat.exists else 'N/A' }}",
            "owner_valid": "{{ valid_owner }}",
            "naming_valid": "{{ valid_naming }}",
            "group_valid": "{{ valid_group }}",
            "permission_valid": "{{ valid_permission }}",
            "compliant": "{{ path_compliant }}",
          }
      loop: "{{ cis_67_stat_results.results | default([]) }}"
      loop_control:
        loop_var: dir_item
      when: cis_67_stat_results is defined

    # Determinar estado general
    - name: (Check - CIS 67) - Establecer estado general
      ansible.builtin.set_fact:
        cis_67_total_paths: "{{ cis_67_path_details | length }}"
        cis_67_valid_count: "{{ cis_67_compliant_paths | length }}"
        cis_67_invalid_count: "{{ cis_67_non_compliant_paths | length }}"
        cis_67_compliant_initial: "{{
          cis_67_param_configured and
          cis_67_non_compliant_paths | length == 0 and
          cis_67_path_details | length > 0 }}"
        cis_67_compliant_final: "{{
          cis_67_param_configured and
          cis_67_non_compliant_paths | length == 0 and
          cis_67_path_details | length > 0 }}"
        cis_67_was_remediated: false

    # Mostrar resultados para depuración
    - name: (Check - CIS 67) - Mostrar resultados
      ansible.builtin.debug:
        msg:
          - "Instancia: {{ hardening_current_instance }}"
          - "Parámetro configurado: {{ cis_67_param_configured }}"
          - "Rutas válidas: {{ cis_67_valid_count }}"
          - "Rutas no válidas: {{ cis_67_invalid_count }}"
          - "Estado de cumplimiento: {{ cis_67_compliant_initial }}"
        verbosity: 1

    # Agregar resultados a la lista global
    - name: Agregar resultados a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_67] }}"
      vars:
        instance_result_cis_67:
          instance_name: "{{ hardening_current_instance }}"
          cis_67:
            parametro: "init.ora user_dump_dest"
            description: "Configuración del parámetro user_dump_dest para el destino de archivos de usuario"
            implementacion: |
              El destino user_dump_dest debe ser un directorio válido propiedad del
              usuario que ejecuta la instancia (debe seguir el patrón 'ora' + 3-4 caracteres o ser
              'grid') y debe pertenecer a un grupo válido (dba, oinstall, asmdba). Los permisos
              deben ser 0750 o más restrictivos.
            verificacion: >-
              Verificar que el parámetro user_dump_dest esté configurado correctamente y que
              los directorios cumplan con los requisitos de permisos y propiedad.
            objetivo: >-
              Asegurar que los archivos de dump de usuario estén en directorios seguros, con acceso
              restringido solo al propietario y grupo correspondiente.
            commando: |
              SQL> show parameter user_dump_dest;
              ls -la <ruta_user_dump_dest>
            nota: "Los permisos 0750 significan rwxr-x--- (propietario: rwx, grupo: r-x, otros: ---)"
            type: "filesystem"
            param_configured: "{{ cis_67_param_configured }}"
            param_value: "{{ cis_67_param_value }}"
            path_details: "{{ cis_67_path_details }}"
            instance_user: "{{ hardening_current_user }}"
            instance_user_valid: "{{ cis_67_instance_user_valid }}"
            valid_pattern: "{{ cis_67_valid_pattern }}"
            valid_groups: "{{ cis_67_valid_groups }}"
            total_paths: "{{ cis_67_total_paths }}"
            valid_count: "{{ cis_67_valid_count }}"
            invalid_count: "{{ cis_67_invalid_count }}"
            compliant_initial: "{{ cis_67_compliant_initial }}"
            compliant_final: "{{ cis_67_compliant_final }}"
            was_remediated: false
