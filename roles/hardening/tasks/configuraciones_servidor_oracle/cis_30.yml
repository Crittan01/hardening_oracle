# roles/hardening/tasks/configuraciones_servidor_oracle/cis_30.yml
---
- name: CIS 30 - Verificación de DYNAMIC_REGISTRATION_listener_name
  block:
    # Paso 1: Verificar la existencia del archivo listener.ora
    - name: (Check - CIS 30) - Comprobar si existe el archivo listener.ora
      ansible.builtin.stat:
        path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
      register: cis_30_listener_file
      become: true
      become_user: "{{ hardening_current_user }}"

    # Paso 2: Obtener el nombre del listener (asumimos "LISTENER" por defecto)
    - name: (Check - CIS 30) - Establecer nombre del listener
      ansible.builtin.set_fact:
        cis_30_listener_name: "LISTENER"

    # Paso 3: Verificar el valor actual del parámetro en listener.ora si existe
    - name: (Check - CIS 30) - Verificar valor actual de DYNAMIC_REGISTRATION_{{ cis_30_listener_name }}
      ansible.builtin.shell: >-
        grep -i "DYNAMIC_REGISTRATION_{{ cis_30_listener_name }}" {{ hardening_oracle_home }}/network/admin/listener.ora || echo "No encontrado"
      become: true
      become_user: "{{ hardening_current_user }}"
      register: cis_30_grep_result
      changed_when: false
      when: cis_30_listener_file.stat.exists

    # Paso 4: Procesar los resultados
    - name: (Check - CIS 30) - Procesar resultados
      ansible.builtin.set_fact:
        cis_30_listener_exists: "{{ cis_30_listener_file.stat.exists | default(false) }}"
        cis_30_param_exists:
          "{{ 'No encontrado' not in cis_30_grep_result.stdout | default('No encontrado')
          if cis_30_listener_file.stat.exists | default(false) else false }}"
        cis_30_param_value:
          "{{ cis_30_grep_result.stdout.split('=')[1] | trim if 'No encontrado' not in cis_30_grep_result.stdout | default('No encontrado')
          and cis_30_listener_file.stat.exists | default(false) else 'No configurado' }}"

    # Paso 5: Verificar si el parámetro está configurado como OFF
    - name: (Check - CIS 30) - Verificar si está configurado como OFF
      ansible.builtin.set_fact:
        cis_30_is_off: "{{ 'OFF' in cis_30_param_value | default('') | upper }}"

    # Paso 6: Determinar el estado de cumplimiento inicial
    - name: (Check - CIS 30) - Determinar cumplimiento
      ansible.builtin.set_fact:
        cis_30_compliant_initial: "{{ cis_30_param_exists and cis_30_is_off }}"

    # Paso 7: Mostrar resultados para depuración
    - name: (Check - CIS 30) - Mostrar resultados iniciales
      ansible.builtin.debug:
        msg:
          - "Archivo listener.ora existe: {{ cis_30_listener_exists }}"
          - "Nombre del listener: {{ cis_30_listener_name }}"
          - "Parámetro DYNAMIC_REGISTRATION_{{ cis_30_listener_name }} configurado: {{ cis_30_param_exists }}"
          - "Valor actual: {{ cis_30_param_value }}"
          - "Configurado como OFF: {{ cis_30_is_off }}"
          - "Estado de cumplimiento: {{ cis_30_compliant_initial }}"
        verbosity: 0

    # Paso 8: Determinar si se requiere remediación
    - name: (Check - CIS 30) - Determinar si se requiere remediación
      ansible.builtin.set_fact:
        cis_30_needs_remediation: "{{ not cis_30_compliant_initial }}"

    # Paso 9: Bloque de remediación - Solo se ejecuta si se requiere remediación
    - name: (Remediation - CIS 30) - Configurar DYNAMIC_REGISTRATION_{{ cis_30_listener_name }}
      when: cis_30_needs_remediation
      block:
        # Paso 9.0: Obtener grupo principal del usuario
        - name: Obtener grupo principal del usuario
          ansible.builtin.shell: |
            set -o pipefail
            id -gn
          register: grp_princ
          changed_when: false
          become: true
          become_user: "{{ hardening_current_user }}"

        # Paso 9.1: Crear backup del archivo listener.ora si existe
        - name: (Remediation - CIS 30) - Crear backup del archivo listener.ora
          ansible.builtin.copy:
            src: "{{ hardening_oracle_home }}/network/admin/listener.ora"
            dest: "{{ hardening_oracle_home }}/network/admin/listener.ora.{{ ansible_date_time.date }}"
            remote_src: true
            owner: "{{ cis_30_listener_file.stat.pw_name }}"
            group: "{{ cis_30_listener_file.stat.gr_name }}"
            mode: "{{ cis_30_listener_file.stat.mode }}"
          become: true
          when: cis_30_listener_exists

        # Paso 9.2: Crear el archivo listener.ora si no existe
        - name: (Remediation - CIS 30) - Crear el archivo listener.ora si no existe
          ansible.builtin.file:
            path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
            state: touch
            owner: "{{ hardening_current_user }}"
            group: "{{ grp_princ.stdout | trim }}"
            mode: "0644"
          become: true
          when: not cis_30_listener_exists

        # Paso 9.3: Configurar el parámetro en listener.ora
        - name: (Remediation - CIS 30) - Configurar parámetro DYNAMIC_REGISTRATION_{{ cis_30_listener_name }}
          ansible.builtin.lineinfile:
            path: "{{ hardening_oracle_home }}/network/admin/listener.ora"
            regexp: "^\\s*DYNAMIC_REGISTRATION_{{ cis_30_listener_name }}\\s*="
            line: "DYNAMIC_REGISTRATION_{{ cis_30_listener_name }}=OFF"
            state: present
            backup: false
          become: true
          become_user: "{{ hardening_current_user }}"
          register: cis_30_parameter_config

        # Paso 9.4: Establecer que la remediación se ha aplicado
        - name: (Remediation - CIS 30) - Establecer estado después de la remediación
          ansible.builtin.set_fact:
            cis_30_was_remediated: true
            cis_30_compliant_final: true
            cis_30_remediated_param_value: "OFF"

    # Paso 10: Establecer valores finales cuando no se requiere remediación
    - name: (No Remediation Needed - CIS 30) - Establecer estado cuando no hay remediación
      ansible.builtin.set_fact:
        cis_30_was_remediated: false
        cis_30_compliant_final: "{{ cis_30_compliant_initial }}"
        cis_30_remediated_param_value: "{{ cis_30_param_value }}"
      when: not cis_30_needs_remediation | bool

    # Paso 11: Agregar los resultados a la lista global
    - name: Agregar resultados de CIS 30 a la lista global
      ansible.builtin.set_fact:
        instances_results: "{{ instances_results | default([]) + [instance_result_cis_30] }}"
      vars:
        instance_result_cis_30:
          instance_name: "{{ hardening_current_instance }}"
          cis_30:
            parametro: "listener.ora - dynamic_registration_listener_name"
            description: "Solo se deben aceptar registros estáticos. Da los derechos de registro a otros usuarios."
            implementacion: |
              Configurar el siguiente parámetro:
              DYNAMIC_REGISTRATION_listener_name=OFF
            verificacion: >-
              Verificar la configuración establecida abriendo el archivo listener.ora y
              verifique el parámetro indicado en la implementación.
            commando: |
              cd $ORACLE_HOME/network/admin
              cat listener.ora | grep -i DYNAMIC_REGISTRATION_LISTENER
            remediacion: |
              Configurar en listener.ora:
              DYNAMIC_REGISTRATION_LISTENER=OFF
            nota: >-
              Este parámetro asegura que solo se acepten registros estáticos para
              el listener, limitando los derechos de registro a otros usuarios.
            type: "network"
            listener_exists: "{{ cis_30_listener_exists }}"
            listener_name: "{{ cis_30_listener_name }}"
            param_exists: "{{ cis_30_param_exists }}"
            param_value: "{{ cis_30_param_value }}"
            is_off: "{{ cis_30_is_off }}"
            remediated_param_value: "{{ cis_30_remediated_param_value }}"
            compliant_initial: "{{ cis_30_compliant_initial }}"
            compliant_final: "{{ cis_30_compliant_final }}"
            was_remediated: "{{ cis_30_was_remediated }}"
